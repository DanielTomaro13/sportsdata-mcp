# Example sportsdata-mcp config.
# Resolution order: --config flag > $SPORTSDATA_MCP_CONFIG > ./sportsdata-mcp.yaml
#   > ~/.config/sportsdata-mcp/config.yaml > built-in defaults.

# Which tool groups to expose. Run `sportsdata-mcp list-groups` for the full list.
# Meta-tools (list_available_groups, list_tools_by_capability, list_resources) are
# always registered regardless of this list.
enabled_groups:
  - afl.public.core
  - afl.public.broadcasting
  - afl.public.content

# Per-provider overrides (all optional; sensible defaults apply otherwise).
providers:
  afl:
    request_timeout_seconds: 30
    rate_limit_rps: 10          # sustained requests/sec (token bucket)
    max_response_bytes: 0       # 0 = no cap (the default); set a positive byte count to guard context

  # NBA ships its own spec-level defaults (Akamai-friendly throttle + 429/5xx retry).
  # Everything below is optional — uncomment to override the shipped defaults.
  # nba:
  #   rate_limit_rps: 0.4         # ~1 request / 2.5s (raise at your own risk; Akamai is strict)
  #   request_timeout_seconds: 45
  #   burst: 1
  #   max_retries: 3
  #   retry_statuses: [429, 500, 502, 503, 504]
  #   retry_backoff_seconds: 1.0

# There is no response-size cap by default. To opt in to one, set a positive value
# either per-provider (above) or globally via SPORTSDATA_MCP_MAX_BYTES.
# Precedence: providers.<id>.max_response_bytes > SPORTSDATA_MCP_MAX_BYTES env > 0 (unlimited).

# Secrets for authenticated providers (AFL premium, bookmakers, …).
# A static_header auth that reads `env: SOME_VAR` is satisfied by the real env var
# first, then by a `secrets: { SOME_VAR: "..." }` entry of the same name. Prefer
# environment variables in production; this block is for local use only.
secrets: {}
