spec_version: 1

provider:
  id: sportsbet
  display_name: "Sportsbet (Australia)"
  # Licensed for the Australian market and geo-blocked elsewhere.
  region: [AU]
  doc_url: "https://github.com/DanielTomaro13/sportsdata-mcp/blob/main/documentation/Sportsbet.md"
  base_urls:
    default: https://www.sportsbet.com.au/apigw
  default_headers:
    User-Agent: "Mozilla/5.0 (compatible; sportsdata-mcp/0.1)"
    Origin: https://www.sportsbet.com.au
    Referer: https://www.sportsbet.com.au/
  auth:
    default:
      type: none
    # THE ACCOUNT TIER. Everything under /apigw that touches a real account authorises on
    # a short-lived `accesstoken` JWT — NOT on the session cookie. Verified live: a
    # same-origin request carrying the cookies still returns 400, because the cookie is
    # not the credential.
    #
    # Sportsbet's CIAM is PingFederate and publishes discovery at
    # /apigw/ciam/.well-known/openid-configuration. `refresh_token` is a supported grant
    # and "none" is among token_endpoint_auth_methods_supported — a PUBLIC client, so
    # there is no client id or secret to hold, only the refresh token.
    #
    # THE PASSWORD GRANT IS CLOSED. Settled empirically 2026-08-28, in two steps:
    #
    #   no client_id  -> 400 invalid_client, "Unidentified clients cannot make password
    #                    grant type requests"
    #   client_id=cxp -> 400 unauthorized_client
    #
    # The second is decisive. `password` IS in the server's grant_types_supported, but
    # `cxp` — the only public client id the site exposes (platformConfig.pingClientId,
    # in the clear in every /ciam/authorise URL) — is not authorised to use it. The web
    # app itself only ever uses authorization_code + PKCE with response_mode=pi.flow,
    # confirmed from a real login capture. Nothing short of presenting as a different
    # client would change this, so username/password is not a route in.
    #
    # username_env/password_env are deliberately NOT set. They are not merely useless
    # here, they are harmful: OAuthRefreshProvider falls back to the password grant
    # when a refresh token dies AND login creds are configured, so a dead token would
    # report "password grant failed: unauthorized_client" instead of the accurate and
    # actionable "refresh token expired -- harvest a new one".
    #
    # The other two headers every account call wants are DERIVED, not user-supplied:
    #   customer-id  is the `custId` claim inside the access token this grant returns
    #   apptoken     is a static public app key, identical on every request for every
    #                user (documentation/Sportsbet.md, docs/PLACEMENT-SPORTSBET.md)
    # So the ONLY thing a human supplies is SPORTSBET_REFRESH_TOKEN, harvested from a
    # real browser login (devtools -> Network -> the POST to /ciam/token -> the
    # `refresh_token` in the JSON response). It is opaque, ~40 chars, and is NOT the
    # `eyJ…` access token sitting beside it, which dies in ~15 minutes.
    #
    # `optional: true` so keyless installs keep working: every other Sportsbet tool in
    # this spec is anonymous and must stay that way.
    account:
      type: oauth_refresh
      token_url: https://www.sportsbet.com.au/apigw/ciam/token
      grant: refresh_token
      # NO client_id here on purpose. The REFRESH grant is verified to work without
      # one, and a client id is only needed for the password grant — which is closed
      # (see above), so carrying it would be scaffolding for a route that does not
      # exist. For the record the value is public: `pingClientId` in the web app's
      # platformConfig, literally "cxp", visible in every /ciam/authorise URL.
      refresh_token_env: SPORTSBET_REFRESH_TOKEN
      header: accesstoken
      value_prefix: ""
      optional: true

endpoints:
  # ─── sportsbet.account — YOUR REAL ACCOUNT (auth: account) ─────────────
  # These three need SPORTSBET_REFRESH_TOKEN. Everything else in this spec is anonymous.
  - name: sportsbet_bet_history
    group: sportsbet.account
    capabilities: []
    summary: "Your own bets at Sportsbet. THIS IS HOW A PLACEMENT IS CONFIRMED — placing answers 202 Accepted, so a bet is only really on once it appears here."
    base: default
    path: /history/bets
    auth: account
    params:
      - { name: appToken, in: header, api_name: apptoken, type: string, required: true, description: "Sportsbet's app key — a short constant the web client sends on every /apigw call. Not a personal credential, but not published either; read it from the browser once. Collected by `sportsdata-mcp connect sportsbet`." }
      - { name: customerId, in: header, api_name: customer-id, type: string, required: true, description: "Your own account number. It is also the `custId` claim inside the access token, so it is not extra authority — the gateway just wants it stated. Collected by `connect`." }
      - { name: channel, in: header, type: string, default: cxp, description: "Client channel. `cxp` is what the website sends; leave it." }
      - { name: requestId, in: header, api_name: x-request-id, type: string, description: "A fresh UUID per call, for Sportsbet's own tracing. Optional here; send a new one each time if you send one at all." }
      - { name: filterType, in: query, type: string, default: SETTLED, enum: [SETTLED, PENDING], description: "Which bets. SETTLED is verified; PENDING alone was rejected on probing and may need other parameters alongside it." }
      - { name: dateType, in: query, type: string, default: ALL, description: "Date window. ALL is what the site sends." }
      - { name: limit, in: query, type: integer, default: 10, description: "How many bets." }
      - { name: includeLegData, in: query, type: boolean, default: true, description: "Include each bet's legs — needed to verify WHAT was bet, not just that something was." }
      - { name: sortField, in: query, type: string, default: DATE, description: "Sort field." }
      - { name: sortOrder, in: query, type: string, default: DESC, description: "Newest first." }
    response_hint: "{betList:[…]}  — the account's bets. VERIFIED live 2026-08-28.\n\nTHE KEY IS `betList`, NOT `bets`. Reading `bets` returns nothing and looks exactly like an empty account — which is a dangerous false negative when you are checking whether a placement landed.\n\nTHIS IS HOW A PLACEMENT IS CONFIRMED. sportsbet_place_bet answers 202 Accepted, which means taken for processing rather than on, so a bet is only really placed once it appears here. Match on the `betId` the placement returned, and check the STAKE AND THE PRICE, not merely that a bet exists.\n\n`filterType` takes SETTLED and PENDING — both verified 2026-08-28 alongside limit and includeLegData. PENDING is what you want for reading back a bet you have just placed.\n\nRows carry `betId`, `receipt`, `stake`, `price`, `placedAt`, `summary`, and per-leg detail including externalClassId / externalMeetingId / externalOutcomeId — the racing external ids that placement itself does NOT use."

  - name: sportsbet_price_slip
    group: sportsbet.account
    capabilities: [sport.prices]
    method: PUT
    # A PUT that prices a slip and places nothing. It is the step the website itself
    # performs before every placement, and the only source of a price you can actually bet.
    read_only: true
    summary: "PRICE A BET SLIP — the authoritative, current price for selections you are about to back. Call this IMMEDIATELY before sportsbet_place_bet: placement takes a price you assert, not a quote id, so this is the only way to place at a real number."
    base: default
    path: /acs/bets/combinations
    auth: account
    params:
      - { name: appToken, in: header, api_name: apptoken, type: string, required: true, description: "Sportsbet's app key — a short constant the web client sends on every /apigw call. Not a personal credential, but not published either; read it from the browser once. Collected by `sportsdata-mcp connect sportsbet`." }
      - { name: customerId, in: header, api_name: customer-id, type: string, required: true, description: "Your own account number. It is also the `custId` claim inside the access token, so it is not extra authority — the gateway just wants it stated. Collected by `connect`." }
      - { name: channel, in: header, type: string, default: cxp, description: "Client channel. `cxp` is what the website sends; leave it." }
      - { name: requestId, in: header, api_name: x-request-id, type: string, description: "A fresh UUID per call, for Sportsbet's own tracing. Optional here; send a new one each time if you send one at all." }
      - { name: betItems, in: body, type: json, required: true, description: 'The slip: [{"betNo": 1, "legs": [{...}]}]. Leg shape matches sportsbet_place_bet — see its description for the parts/externalId structure.' }
      - { name: apiVersion, in: header, api_name: x-api-version, type: string, default: "2.0.0", description: "Pricing is served at 2.0.0 (placement is 3.0.0). Understating it silently gets you an older schema." }
      - { name: outcomeGroups, in: body, type: json, default: [], description: "REQUIRED even when empty — omitting it is refused 'Field is required: outcomeGroups'. The declared default now actually reaches the wire (see registry._value_for); before that fix a `default: []` on a body param was decorative." }
      - { name: returnOutcomeDetails, in: body, type: boolean, default: true, description: "Include the outcome detail; useful for confirming you priced what you meant." }
      - { name: returnCashoutAvailable, in: body, type: boolean, default: true, description: "Whether cash-out is offered on the resulting bet." }
      - { name: returnFreebetTokens, in: body, type: boolean, default: false, description: "Include eligible freebet tokens." }
      - { name: returnVouchers, in: body, type: boolean, default: false, description: "Include vouchers." }
      - { name: includeMBS, in: body, type: boolean, default: false, description: "Include minimum bet size information." }
    response_hint: "{betBuilds:[{betNo, enhancedOdds:[{outcome, priceDecimal, priceNum, priceDen, legType}], betCombinations:[{betType, betTypeName, betMinStake, betNoOfLines, cashoutAvailable, betEnhancedPrice}], vouchers:[]}]}  — VERIFIED live 2026-08-27.\n\nTHIS IS THE AUTHORITATIVE PRICE, and it is the call to make immediately before placing. sportsbet_place_bet does NOT take a quote id: it takes a price you assert, so the only way to place at a real price is to read it here first and send THAT number. A price remembered from thirty seconds ago is not a price.\n\n`betMinStake` comes back per combination and was 0.01 on the verified slip — the smallest possible test bet is a cent, not a dollar.\n\nPrices appear twice and in two forms: `priceDecimal` on each enhanced odd, and `priceNum`/`priceDen` which is what placement wants. Carry the fraction across unchanged rather than re-deriving it from the decimal, which rounds."

  # ─── RACING PLACEMENT: THE VERIFIED CONTRACT ──────────────────────────
  # Proven end-to-end 2026-08-28 with a real $0.01 win single (betId 7039196689,
  # receipt O/4102809/0003396/D, Geelong R6). The betItems description on
  # sportsbet_place_bet below is written against SPORTS/SGM bets and is WRONG for
  # racing in almost every particular. For a race:
  #
  #   NO EXTERNAL IDS. Not classExternalId, competitionExternalId, eventExternalId,
  #   marketExternalId or outcomeExternalId. `outcome` is the plain selection id
  #   straight out of sportsbet_racecard. (External racing ids do exist -- bet
  #   history exposes externalClassId 1054, externalMeetingId, externalOutcomeId --
  #   but placement does not want them.)
  #
  #   body: {"betItems":[{"betNo":1,"stakePerLine":0.01,"numLines":1,
  #           "betType":"SGL","legType":"W",
  #           "legs":[{"legNo":1,"legSort":"--","legType":"W","legDesc":"",
  #                    "isPYPSingle":false,
  #                    "parts":[{"outcome":<selection id>,"partNo":1,
  #                              "priceType":"L","partDesc":"RACECARD",
  #                              "priceNum":N,"priceDen":D}]}]}],
  #          "checkBalance":true,"errorDetail":"ALL","firstBet":true,
  #          "fullDetails":true,"pendingBetCount":true,"returnBalance":false,
  #          "returnCashoutAvailable":true}
  #
  #   partDesc is "RACECARD" for racing; "ALLMARKETS" is the sports/SGM value.
  #   legType "W" wins, "L" is the place leg (which carries placePriceNum/Den/Places
  #   instead of priceNum/priceDen).
  #   outcomeGroups is sent to PRICING only, never to placement.
  #
  # HEADERS THAT ARE NOT OPTIONAL
  #   transuniqueid   a HEADER, not a body field. Must match ^[a-f0-9]{29}$ --
  #                   a dashed UUID is refused "invalid element format". It is the
  #                   idempotency key: generate a fresh one per attempt.
  #   x-api-version   3.0.0 for /acs/bets, 2.0.0 for /acs/bets/combinations. The
  #                   gateway serves an older schema silently if you understate it.
  #   errorDetail     "ALL"|"FIRST"|"NONE" for placement; pricing takes "CONTINUE".
  #
  # READING THE ANSWER
  #   HTTP 200 IS NOT SUCCESS. A 200 carrying `betFailures` is a refusal that placed
  #   nothing. Only `betPlacements` means a bet exists. Failure reasons for business
  #   rejections are nested TWO levels down: betFailures[].betErrors[].
  #   Code 535 "price has changed" returns the CURRENT price in betFailureDetail,
  #   so it can be retried at that price -- check it is still worth taking first.
  #   Bet history returns its rows under `betList`, not `bets`.
  #
  # THE REFRESH TOKEN ROTATES ON EVERY USE and the old one dies immediately. Persist
  # the new value from each mint or the next run fails; the browser session rotates
  # it too, so a token harvested and left sitting goes stale on its own.

  - name: sportsbet_place_bet
    group: sportsbet.write
    capabilities: []
    method: POST
    summary: "PLACE A REAL BET WITH REAL MONEY on your own Sportsbet account. Irreversible. Call sportsbet_price_slip first and send the price it returned — this endpoint takes an asserted price, not a quote id."
    base: default
    path: /acs/bets
    auth: account
    params:
      - { name: appToken, in: header, api_name: apptoken, type: string, required: true, description: "Sportsbet's app key — a short constant the web client sends on every /apigw call. Not a personal credential, but not published either; read it from the browser once. Collected by `sportsdata-mcp connect sportsbet`." }
      - { name: customerId, in: header, api_name: customer-id, type: string, required: true, description: "Your own account number. It is also the `custId` claim inside the access token, so it is not extra authority — the gateway just wants it stated. Collected by `connect`." }
      - { name: channel, in: header, type: string, default: cxp, description: "Client channel. `cxp` is what the website sends; leave it." }
      - { name: requestId, in: header, api_name: x-request-id, type: string, description: "A fresh UUID per call, for Sportsbet's own tracing. Optional here; send a new one each time if you send one at all." }
      - { name: transUniqueId, in: header, api_name: transuniqueid, type: string, required: true, description: "IDEMPOTENCY KEY, and it is a HEADER — not a body field. Must match ^[a-f0-9]{29}$: 29 lowercase hex characters. A dashed UUID is refused 'invalid element format' (code 579); `uuid4().hex[:29]` satisfies it. Generate a FRESH one per attempt — reusing one across attempts is what an idempotency key exists to prevent." }
      - { name: apiVersion, in: header, api_name: x-api-version, type: string, default: "3.0.0", description: "PLACEMENT IS SERVED AT 3.0.0. The gateway advertises 1.0.0, 2.0.0 and 3.0.0 and silently serves an OLDER SCHEMA if you understate or omit it — which is how a correctly-shaped racing bet gets refused for no visible reason. Pricing (sportsbet_price_slip) is 2.0.0." }
      - { name: betItems, in: body, type: json, required: true, description: 'The bets. FOR RACING SEE THE VERIFIED CONTRACT BLOCK ABOVE — racing sends NO external ids and this description does not apply to it. For SPORTS/SGM, one item: {betNo, betType: "SGL", stakePerLine, numLines: 1, legs: [{legNo, legSort: "IM", legType: "W", legDesc: "EXT_PP", isPYPSingle: false, classExternalId, competitionExternalId, eventExternalId, parts: [{partNo, outcome, priceType: "L", partDesc: "ALLMARKETS", priceNum, priceDen, marketExternalId, outcomeExternalId}]}]}. A SAME GAME MULTI IS ONE LEG WITH SEVERAL `parts` and betType "SGL" — not a multi-leg bet — and the combined price is carried as priceNum/priceDen REPLICATED ON EVERY PART. The external ids are the same id space sportsbet_sgm_price uses (AFL: class 103, competition 17131), NOT the internal ids in a market topicLink. `stakePerLine` is the stake; `betMinStake` from sportsbet_price_slip was 0.01.' }
      - { name: checkBalance, in: body, type: boolean, default: true, description: "Have Sportsbet check the balance covers the stake before accepting. Leave true." }
      - { name: returnBalance, in: body, type: boolean, default: true, description: "Return the resulting balance." }
      - { name: returnCashoutAvailable, in: body, type: boolean, default: false, description: "Return whether cash-out is offered." }
      - { name: fullDetails, in: body, type: boolean, default: true, description: "Return the full placement detail — needed to read back betId and betPotentialWin." }
      - { name: errorDetail, in: body, type: string, default: "ALL", enum: [FIRST, ALL, NONE], description: "Error verbosity. MUST match ^(FIRST|ALL|NONE)$ — an empty string is refused 'invalid element format' (code 579), so the previously documented default of \"\" could never have worked. Note PRICING takes a different value entirely (\"CONTINUE\"), which placement rejects. \"ALL\" gives the fullest reporting." }
    response_hint: "{pendingBetCount, betPlacements:[{betNo, betId, receipt, totalStake, currency, betPotentialWin, cashoutAvailable}]}  — VERIFIED live 2026-08-27 on a real bet.\n\nHTTP 202 ACCEPTED, NOT 201 CREATED. The bet has been taken for PROCESSING; it is not yet confirmed on. `pendingBetCount` says so. A 202 is not proof of anything, so ALWAYS read back with sportsbet_bet_history and confirm the bet is really there.\n\nCHECK THE PRICE YOU GOT. `betPotentialWin / totalStake` is the accepted decimal price — 39.50 / 10 = 3.95 on the verified bet, matching what was sent. If it does not match what you priced, the bet went on at a price nobody agreed to: escalate, do not place more.\n\nNEVER RETRY THIS CALL. A placement that timed out may already have landed, and a retry puts the bet on twice. On any timeout or ambiguous failure the correct action is to read bet history and find out what happened — never to send it again.\n\n`betId` is the handle for read-back and `receipt` is the human-readable reference."

  # ─── sportsbet.racing (15) — sportsbook-racing service ─────────────────
  - name: sportsbet_racing_allracing
    group: sportsbet.racing
    capabilities: [racing.meetings_by_date]
    summary: "All race meetings (every code) for one date, grouped by meeting."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/AllRacing/{eventDate}
    auth: default
    params:
      - { name: eventDate, in: path, type: string, description: "Race date, YYYY-MM-DD." }
    response_hint: "{meetings:[{competitionId, name, raceType, events:[{eventId, raceNumber, advertisedStartTime}]}]}"
    examples:
      - description: "All racing for a given day"
        params: {eventDate: "{{today}}"}

  - name: sportsbet_racing_event_meeting
    group: sportsbet.racing
    capabilities: [racing.meetings_by_date]
    summary: "Meeting context for one racing event (parent meeting + sibling races)."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/Events/{eventId}/Meeting
    auth: default
    params:
      - { name: eventId, in: path, type: integer, description: "Racing event id." }
    response_hint: "{meeting:{competitionId, name}, races:[{eventId, raceNumber}]}"

  - name: sportsbet_racecard
    group: sportsbet.racing
    capabilities: [racing.race_card]
    summary: "Racecard for one race: runners, prices, scratchings."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/Events/{eventId}/Racecard
    auth: default
    # A GET, so the 60s response cache would serve the same prices to every poll. Live
    # racing prices move in seconds and the board polls far faster than the cache TTL, so
    # a cached racecard makes fast polling silently pointless — the numbers simply do not
    # change. Same reasoning as entain_sgm_price. Prices are never cached.
    never_cache: true
    params:
      - { name: eventId, in: path, type: integer, description: "Racing event id." }
      - { name: selectionNames, in: query, type: boolean, description: "Include full selection (runner) names." }
    response_hint: "{event:{eventId, raceNumber}, markets:[{marketId, name, selections:[{name, price:{winPrice, winPriceNum, winPriceDen}}]}]}"

  - name: sportsbet_racecard_with_context
    group: sportsbet.racing
    capabilities: [racing.race_card]
    summary: "Racecard plus surrounding context (meeting, results, related markets) for one race."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/Events/{eventId}/RacecardWithContext
    auth: default
    params:
      - { name: eventId, in: path, type: integer, description: "Racing event id." }
      - { name: classId, in: query, type: integer, required: true, description: "Racing class id (race type/class), required by upstream." }
    response_hint: "{event:{}, markets:[], meeting:{}, context:{}}"
    examples:
      - description: "Racecard with context for one race"
        params: {eventId: 10513900, classId: 1}

  - name: sportsbet_multiple_racecards
    group: sportsbet.racing
    capabilities: [racing.race_card]
    summary: "Racecards for several races in one call (batch by event ids)."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/Events/MultipleRacecards
    auth: default
    params:
      - { name: eventIds, in: query, type: string_csv, required: true, description: "Comma-separated racing event ids." }
    response_hint: "{racecards:[{event:{}, markets:[]}]}"

  - name: sportsbet_racing_competition
    group: sportsbet.racing
    capabilities: [racing.meetings_by_date]
    summary: "Racing competition (meeting) detail by competition id."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/Competitions/{competitionId}
    auth: default
    params:
      - { name: competitionId, in: path, type: integer, description: "Racing competition (meeting) id." }
    response_hint: "{competition:{competitionId, name, raceType}, events:[{eventId, raceNumber}]}"

  - name: sportsbet_racing_resulted_events
    group: sportsbet.racing
    capabilities: [racing.race_results]
    summary: "Resulted races (placings + dividends) for a racing competition + class + date."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/Competitions/{competitionId}/ResultedEvents
    auth: default
    params:
      - { name: competitionId, in: path, type: integer, description: "Racing competition (meeting) id." }
      - { name: classId, in: query, type: integer, required: true, description: "Racing class id." }
      - { name: date, in: query, type: string, required: true, description: "Result date, YYYY-MM-DD." }
    response_hint: "{events:[{eventId, raceNumber, results:[{place, selectionName}], dividends:[]}]}"

  - name: sportsbet_racing_futures
    group: sportsbet.racing
    capabilities: [racing.futures]
    summary: "Racing futures markets (Cup outrights and other long-running racing markets)."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/Futures
    auth: default
    response_hint: "{futures:[{marketId, name, selections:[{name, price:{winPrice}}]}]}"

  - name: sportsbet_racing_best_bets
    group: sportsbet.racing
    # Deliberately untagged. Editorial opinion from ONE book (tips, featured picks, best
    # bets). Not interchangeable with another book's opinion — asking for "tips" should
    # return a named source, never a blend of them.
    capabilities: []
    summary: "Editorially-selected best bets across racing."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/BestBets
    auth: default
    response_hint: "{bestBets:[{eventId, selectionName, price:{winPrice}}]}"

  - name: sportsbet_racing_best_bets_with_events
    group: sportsbet.racing
    # Deliberately untagged. Editorial opinion from ONE book (tips, featured picks, best
    # bets). Not interchangeable with another book's opinion — asking for "tips" should
    # return a named source, never a blend of them.
    capabilities: []
    summary: "Best bets with their full parent event objects inlined."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/BestBetsWithEvents
    auth: default
    response_hint: "{bestBets:[{event:{eventId, raceNumber}, selectionName, price:{winPrice}}]}"

  - name: sportsbet_racing_top_jockeys
    group: sportsbet.racing
    # Deliberately untagged. Editorial opinion from ONE book (tips, featured picks, best
    # bets). Not interchangeable with another book's opinion — asking for "tips" should
    # return a named source, never a blend of them.
    capabilities: []
    summary: "Top jockeys hub (leading jockeys and their rides today)."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/JockeyHub/TopJockeys
    auth: default
    response_hint: "{jockeys:[{name, rides:[{eventId, selectionName}]}]}"

  - name: sportsbet_racing_challenges
    group: sportsbet.racing
    # Deliberately untagged. Editorial opinion from ONE book (tips, featured picks, best
    # bets). Not interchangeable with another book's opinion — asking for "tips" should
    # return a named source, never a blend of them.
    capabilities: []
    summary: "All racing challenges / promotions feed."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/Challenges/All
    auth: default
    response_hint: "{challenges:[{id, name, status}]}"

  - name: sportsbet_racing_megabets
    group: sportsbet.racing
    # Deliberately untagged. Editorial opinion from ONE book (tips, featured picks, best
    # bets). Not interchangeable with another book's opinion — asking for "tips" should
    # return a named source, never a blend of them.
    capabilities: []
    summary: "Racing Megabets (large multi suggestions across races)."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/Megabets
    auth: default
    response_hint: "{megabets:[{id, legs:[{eventId, selectionName}], price:{winPrice}}]}"

  - name: sportsbet_racing_multis_events
    group: sportsbet.racing
    capabilities: [racing.next_to_jump]
    summary: "Events available for racing multis, ordered by start (next-to-jump style feed)."
    base: default
    path: /sportsbook-racing/Sportsbook/Racing/RacingMultisEvents
    auth: default
