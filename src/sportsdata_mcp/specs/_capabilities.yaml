# Canonical capability catalogue.
#
# A capability is a provider-agnostic slug naming *the question an endpoint answers*.
# The same tag on two providers' tools tells the model they are interchangeable for
# that question — this is the unit of cross-provider comparison.
#
# Rules enforced by `sportsdata-mcp lint`:
#   1. Every `capabilities:` entry on any endpoint must exist here.
#   2. No two capabilities may share a description (typo guard).
#   3. (warning) A capability exposed by only one provider should be marked
#      `single_provider: true`, or another provider should be added.
#
# IDs are `{domain}.{slug}`, lowercase, dot-separated.

capabilities:
  # ─── Racing ──────────────────────────────────────────────────────────
  - id: racing.meetings_by_date
    description: "List all race meetings (track + races) for a given date."
  - id: racing.race_card
    description: "Full racecard for one race: runners, prices, jockeys, scratchings."
  - id: racing.race_results
    description: "Final placings + dividends for a resulted race."
  - id: racing.next_to_jump
    description: "Next races about to start, sorted by start time."
  - id: racing.futures
    description: "Long-running futures markets (Cup outrights, season-long props)."
  - id: racing.same_race_multi
    description: "Same Race Multi (SRM) suggestions or popular combinations."

  # ─── Sport (cross-code) ──────────────────────────────────────────────
  - id: sport.competitions_list
    description: "List sport competitions / leagues / tours."
  - id: sport.competition_screen
    description: "Competition page: leagues, events, optional futures."
  - id: sport.match_detail
    description: "Single sport event/match including teams, venue, start time."
  - id: sport.match_score
    description: "Current scoreboard / period state for a match."
  - id: sport.event_markets
    description: "All markets + selections + prices for one event."
  - id: sport.prices
    description: "Live or last prices for selections."
  - id: sport.same_game_multi
    description: "Same Game Multi (SGM) suggestions or popular combinations."
  - id: sport.in_play
    description: "Events currently in-play / live."
  - id: sport.live_video
    description: "Live video stream URLs."
  - id: sport.live_audio
    description: "Live audio stream URLs."
  - id: sport.commentary
    description: "Text or play-by-play commentary for a match."
  - id: sport.injuries
    description: "Injury report / inactive list for a team or league."
    single_provider: true
  - id: sport.depth_chart
    description: "Team depth chart (positional ordering of the roster)."
    single_provider: true
  - id: sport.transactions
    description: "Roster transactions log (signings, trades, waivers, call-ups)."
  - id: sport.draft
    description: "Draft results / picks for a given season."
  - id: sport.rankings
    description: "Poll rankings (AP, coaches, committee) for a league."
    single_provider: true

  # ─── Stats — basic ───────────────────────────────────────────────────
  - id: stats.player_match
    description: "Per-player stats for a single match / game / fixture."
  - id: stats.player_season
    description: "Per-player stats over a season."
  - id: stats.player_game_log
    description: "Game-by-game stat line for one player across a date range or season."
  - id: stats.player_career
    description: "Per-season totals across a player's career."
  - id: stats.player_profile
    description: "Biographical + career-summary view of one player (height, weight, debut, draft)."
  - id: stats.team_match
    description: "Per-team aggregate stats for a single match."
  - id: stats.team_season
    description: "Per-team aggregate stats over a season."
  - id: stats.team_game_log
    description: "Game-by-game results / form for one team."
  - id: stats.leaders_season
    description: "Season leaders per stat (Coleman, Brownlow, top scorers, MVP, etc.)."
  - id: stats.ladder
    description: "Current ladder / standings / conference standings for a competition."
  - id: stats.head_to_head
    description: "Head-to-head history between two teams."
    single_provider: true

  # ─── Stats — advanced / sport-specific ───────────────────────────────
  - id: stats.advanced_metrics
    description: "Advanced / synergy / tracking stats not in basic box scores (PER, true shooting, xG, etc.)."
  - id: stats.shot_chart
    description: "Shot location / spatial data (basketball, soccer, hockey)."
    single_provider: true
  - id: stats.play_by_play
    description: "Event-level play-by-play log of a game."
  - id: stats.fantasy_projections
    description: "Fantasy-points projections / DFS pricing."
  - id: stats.win_probability
    description: "In-game win-probability time series for a contest."

  - id: stats.closing_odds
    description: "Historical closing prices per match from multiple bookmakers — the baseline for CLV and backtesting."
    single_provider: true

  - id: stats.model_predictions
    description: "Third-party forecasting-model output: tipped winner, predicted margin, confidence, simulated finishing positions."
    single_provider: true

  # ─── Fantasy leagues (a user's own managed league, not the pro competition) ──
  # ESPN Fantasy is the only provider today; drop `single_provider` if a second
  # fantasy platform (Yahoo, Sleeper, DraftKings) is ever added.
  - id: fantasy.league_settings
    description: "A fantasy league's configuration: scoring rules, roster slots, schedule, waivers, keepers."
    single_provider: true
  - id: fantasy.rosters
    description: "Fantasy team rosters / weekly lineups (which players a fantasy manager holds and starts)."
    single_provider: true
  - id: fantasy.matchups
    description: "Fantasy head-to-head matchups for a scoring period, with each side's points."
    single_provider: true
  - id: fantasy.free_agents
    description: "Players available in a fantasy league (free agents / waivers) with ownership and ratings."
    single_provider: true

  # ─── Sport — fixtures (non-betting data sources) ─────────────────────
  - id: sport.fixtures_by_date
    description: "All scheduled fixtures / games on a given date across one league."
  - id: sport.match_boxscore
    description: "Detailed game box score (quarter/period scores, team totals, leaders)."
  - id: sport.season_summary
    description: "End-of-season / current-state league summary (champion, top scorer, awards)."
    single_provider: true

  # ─── Catalogue / reference ───────────────────────────────────────────
  - id: ref.teams
    description: "Team catalogue (id, name, club, colours)."
  - id: ref.players
    description: "Player catalogue (id, name, dob, draft info)."
  - id: ref.venues
    description: "Venue catalogue (id, name, location, timezone)."
  - id: ref.seasons
    description: "Season / competition-season catalogue."
  - id: ref.coaches
    description: "Coach catalogue / coaching records."

  # ─── Content / editorial ─────────────────────────────────────────────
  - id: content.news
    description: "Text articles, news index."
  - id: content.video
    description: "Editorial video content (highlights, replays, press conferences)."
  - id: content.promo
    description: "Promo / marketing cards from CMS."

  # ─── Broadcast ───────────────────────────────────────────────────────
  - id: broadcast.schedule
    description: "Broadcast schedule (who shows what, when, where)."
  - id: broadcast.channels
    description: "Broadcast channel catalogue."
    single_provider: true

  # ─── Prediction markets (Polymarket, Kalshi) ─────────────────────────
  - id: prediction.markets_list
    description: "Catalogue of prediction markets (binary/event contracts) with current quotes."
  - id: prediction.market_detail
    description: "One prediction market's full detail — question, rules, quotes, volume, expiry."
  - id: prediction.events_list
    description: "Prediction-market events/series grouping related markets."
  - id: prediction.market_prices
    description: "Order book / best bid-ask quotes for one prediction market."
  - id: prediction.price_history
    description: "Historical price series (trades-derived candles or ticks) for one prediction market."
  - id: prediction.trades
    description: "Recent public trades on a prediction market."

  # ─── Social (X/Twitter) ──────────────────────────────────────────────
  - id: social.post_search
    description: "Search public social posts by query (teams, players, breaking news)."
    single_provider: true
  - id: social.post_detail
    description: "One or more social posts by id, with engagement metrics."
    single_provider: true
  - id: social.user_profile
    description: "A social account's public profile and follower metrics."
    single_provider: true
  - id: social.user_timeline
    description: "A social account's recent posts (club news, insider feeds)."
    single_provider: true
  - id: social.trends
    description: "Trending topics by location."
    single_provider: true

  # ─── Structure, officials, honours ───────────────────────────────────
  - id: ref.rounds
    description: "Round / matchweek / session structure within a season, and which one is current."
  - id: ref.officials
    description: "Match officials — umpires, referees, assistants and official scorers."
  - id: sport.lineups
    description: "Confirmed or projected starting lineups for a fixture, with formation and bench."
  - id: sport.awards
    description: "Award and honour recipients (player of the month, MVP, hall of fame)."
  - id: sport.cash_out
    description: "Cash-out availability and valuation for open positions."
    single_provider: true

  # ─── Racing depth ────────────────────────────────────────────────────
  - id: racing.form_guide
    description: "Per-runner form history for one race — past runs, ratings and comments."
  - id: racing.pools
    description: "Tote pool sizes, jackpots and carryovers."
  - id: racing.price_history
    description: "Fixed-odds fluctuation history per runner (price movements over time)."
    single_provider: true
  - id: racing.track_conditions
    description: "Track report for a meeting — going, rail position and weather."
    single_provider: true

  # ─── Media ───────────────────────────────────────────────────────────
  - id: content.photo
    description: "Editorial photo and image content items."
    single_provider: true

  # ─── Meta (used by the template/example only) ────────────────────────
  - id: sport.example
    description: "Placeholder capability for the template spec and tests; not a real question."
    single_provider: true
