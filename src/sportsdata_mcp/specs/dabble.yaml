spec_version: 1

# Dabble (dabble.com.au) — the Australian social-betting app's backend, read
# directly. Unofficial. Re-probed live 2026-06-25.
#
# HOW IT WORKS: api.dabble.com.au is the native iOS app's API and is Cloudflare-
# fronted. The trick to reaching it is to pose as the app — send the app's
# User-Agent (Dabble/<build> CFNetwork/<v> Darwin/<v>), an x-device-id and an
# x-app-version. With that header bundle the public feeds return JSON anonymously
# from an AU IP (no Bearer token needed; an optional DABBLE_AUTH bearer exists for
# account features, which are out of scope). Like the other AU books it is
# GEO + bot gated: it works from an Australian connection but will 403/challenge
# from non-AU or datacenter IPs. If Cloudflare ever starts JA3-fingerprinting the
# engine's TLS, a fingerprint-impersonating client (curl_cffi safari_ios) is
# needed — out of scope for the engine's httpx.
#
# Read-only odds data (fixtures, markets, prices) — no bet placement, consistent
# with the repo's no-money invariant.
#
# Works for ANY competition, not just AFL/NRL: discover ids with
# dabble_active_competitions (the ~269 currently-bettable competitions across all
# sports) or dabble_competitions(name=…) (exact-name lookup), then feed the id to
# dabble_competition_fixtures. dabble_sports lists the 24 sports.
#
# Shape: ONE fixtures feed per competition embeds markets + prices + selections;
# the per-fixture `details` endpoint returns the FULL book (hundreds of markets +
# the Pick'em playerProps product). Markets join to selections + prices by
# marketId / selectionId. Competition/sport ids are opaque UUIDs. (The unfiltered
# /competitions catalogue is a ~38 MB / 140k-row dump and is deliberately not
# modelled — use the active list or the name filter instead.)

provider:
  id: dabble
  display_name: "Dabble (dabble.com.au)"
  doc_url: "https://github.com/DanielTomaro13/sportsdata-mcp/blob/main/documentation/Dabble.md"
  base_urls:
    default: https://api.dabble.com.au
  default_headers:
    accept: "application/json"
    accept-language: "en-AU,en;q=0.9"
    user-agent: "Dabble/1000041710 CFNetwork/3826.600.41.2.1 Darwin/24.6.0"
    x-device-id: "00000000-0000-0000-0000-000000000000"
    x-app-version: "4.17.10+019ededb"
  auth:
    default:
      type: none
  defaults:
    # Cloudflare-fronted — keep the rate modest and retry transient statuses.
    rate_limit_rps: 3
    request_timeout_seconds: 30
    retry_statuses: [429, 500, 502, 503, 504]
    max_retries: 2
    retry_backoff_seconds: 0.5

endpoints:
  # ─── discovery — find any competition's id ────────────────────────────
  - name: dabble_active_competitions
    group: dabble.sport
    capabilities: [sport.competitions_list]
    summary: "Every currently-bettable competition across all sports (~269) — the discovery entry point. Pick any one's `id` and pass it to dabble_competition_fixtures. Each carries name, sportName, country and a featured flag."
    base: default
    path: /competitions/active
    auth: default
    response_hint: "{status, data:{activeCompetitions:[{id, name, sportName, country, featured, location, sportId}]}}"

  - name: dabble_competitions
    group: dabble.sport
    capabilities: [sport.competitions_list]
    summary: "Look up competitions by EXACT name (case-sensitive; e.g. 'NRL', 'Premier League', 'AFL Matches' — note 'AFL' alone returns nothing). Returns the matching competition(s) with their id(s). For browsing, prefer dabble_active_competitions."
    base: default
    path: /competitions
    auth: default
    params:
      - { name: name, in: query, type: string, required: true, description: "Exact competition name (e.g. 'NRL', 'Premier League', 'AFL Matches')." }
    response_hint: "{status, data:[{id, name, sportId, country}]}  (exact-match only — empty if the name isn't exact)"

  - name: dabble_sports
    group: dabble.sport
    summary: "The 24 sports Dabble offers (Rugby League, Australian Rules, Football, Basketball, Cricket, Tennis, Horse Racing, …), each with id + name. Join sportId from a competition back to its sport here."
    base: default
    path: /sports
    auth: default
    response_hint: "{status, data:[{id, name, isRacing, isHidden}]}"

  # ─── fixtures + markets/odds for a competition ────────────────────────
  - name: dabble_competition_fixtures
    group: dabble.sport
    capabilities: [sport.fixtures_by_date, sport.event_markets, sport.prices]
    summary: "All fixtures for ONE competition, each embedding its markets + prices (decimal odds) + selections + teams. Get the competitionId from dabble_active_competitions / dabble_competitions (AFL Matches = ad4c78ec-e39d-45ee-8cec-ff5d485a3205, NRL = c709772d-d5d0-4252-af89-be8a163706dc). For the FULL book of one fixture use dabble_fixture_details."
    base: default
    path: /frontend-api/competitions/{competitionId}/sport-fixtures
    auth: default
    params:
      - { name: competitionId, in: path, type: string, required: true, description: "Competition UUID — from dabble_active_competitions / dabble_competitions (any competition, not just AFL/NRL)." }
      - { name: includeInPlay, in: query, type: boolean, default: false, description: "Include in-play fixtures." }
      - { name: exclude, in: query, type: string, api_name: "exclude[]", default: "none", enum: [none, markets, prices, selections], description: "Slim the payload by dropping an embedded block (default none = include all). Pass one of markets/prices/selections to omit it." }
    response_hint: "{data:[{id, name, displayName, competitionId, competitionName, advertisedStart, status, inplayAvailable, teams:[{id, name, abbreviation}], markets:[{id, name, resultingType, product, isHandicap, isTotal, isSgmAllowed, status}], selections:[{id, name, marketId, isScratched}], prices:[{marketId, selectionId, price}]}]}  (`product` is engine-derived from resultingType — see dabble_fixture_details.)"
    # Engine-derived product tag so consumers never blend Pick'em multipliers into a
    # fixed-odds comparison. (Fixtures embeds the slim core set, so most tag `single`;
    # the full split shows on dabble_fixture_details.)
    classify:
      - field: "data[].markets[].product"
        from: resultingType
        rules: &dabble_product_rules
          - { prefix: "sportcast_", value: sgm }      # SportCast-powered SGM legs
          - { contains: "pickem", value: pickem }     # Pick'em multiplier product (odds_on_pickem_*)
          - { regex: "^RacingSrm", value: srm }       # Same-Race-Multi (racing's SGM) — before ^Racing
          - { regex: "^Racing", value: racing }       # racing win/place/exotics
          - { default: single }                       # core fixed-odds singles
    examples:
      - description: "AFL fixtures with markets + odds"
        params: { competitionId: "ad4c78ec-e39d-45ee-8cec-ff5d485a3205" }

  - name: dabble_fixture_details
    group: dabble.sport
    capabilities: [sport.event_markets, sport.prices, sport.same_game_multi]
    summary: "The FULL book for one fixture — every market (hundreds), all selections + prices, the marketGroups (SGM grouping) and the Pick'em playerProps product. LARGE (~1 MB+ for a major match); fetch one fixture at a time. fixtureId comes from dabble_competition_fixtures. PRODUCT SPLIT lives on markets[].resultingType (NOT the name): SPORTS → `sportcast_*`=SGM legs (isSgmAllowed), `*pickem*` (e.g. odds_on_pickem_goals)=Pick'em multiplier product, unprefixed (e.g. match_score)=core singles (isSingleAllowed). RACING → PascalCase `Racing*`: RacingFixed*/RacingSP*=win/place singles, RacingDD*=exotics, `RacingSrm*`=Same-Race-Multi (no Pick'em in racing)."
    base: default
    path: /frontend-api/sport-fixtures/details/{fixtureId}
    auth: default
    params:
      - { name: fixtureId, in: path, type: string, required: true, description: "Fixture UUID (from dabble_competition_fixtures.data[].id)." }
    response_hint: "{sportFixtureDetail:{id, name, competitionName, sportName, status, teams, markets:[{id, name, resultingType, product, isSgmAllowed, isSingleAllowed}], selections:[{id, name, marketId}], prices:[{marketId, selectionId, price}], marketGroups, marketGroupMappings, playerProps:[{playerName, stats, value, lineType}]}}  (LARGE — markets/selections/prices number in the hundreds-to-thousands. Each market carries an engine-derived `product` ∈ {single, sgm, pickem, srm, racing}, classified from resultingType: sportcast_*→sgm, *pickem*→pickem, RacingSrm*→srm, Racing*→racing, else→single. Use `product=single` (or sgm) for like-for-like price comparison; NEVER blend `pickem` multipliers into fixed-odds value/arb.)"
    # Same product tagger as dabble_competition_fixtures, on the full per-fixture book.
    classify:
      - field: "sportFixtureDetail.markets[].product"
        from: resultingType
        rules: *dabble_product_rules
