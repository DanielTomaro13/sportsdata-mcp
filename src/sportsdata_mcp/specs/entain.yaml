spec_version: 1

provider:
  id: entain
  display_name: "Entain (Ladbrokes / Neds Australia)"
  # Licensed for the Australian market and geo-blocked elsewhere.
  region: [AU]
  doc_url: "https://github.com/DanielTomaro13/sportsdata-mcp/blob/main/documentation/Entain.md"
  base_urls:
    default: https://api.ladbrokes.com.au
    # The Contentful CMS + form guides are proxied through the www host, NOT the API host.
    cms: https://www.ladbrokes.com.au
  # Content-Type: application/json is required on EVERY request — including GET.
  # Without it the go-micro gateway returns HTTP 500 `unsupported content-type`.
  default_headers:
    User-Agent: "Mozilla/5.0 (compatible; sportsdata-mcp/0.1)"
    Origin: https://www.ladbrokes.com.au
    Referer: https://www.ladbrokes.com.au/
    Content-Type: application/json
  auth:
    default:
      type: none
    # THE ACCOUNT TIER. Entain issues an OIDC token set at login and stores it in PLAIN,
    # non-HttpOnly cookies named `web-frontend:token:accessToken`, `…:refreshToken`,
    # `…:expiresAt`, `…:scope`. Verified live 2026-08-27: scope is
    # ["openid","offline_access"] — offline_access being why a refresh token exists — and
    # the access token is a JWT with a ONE-HOUR life, its expiry published in the
    # `expiresAt` cookie as plain milliseconds.
    #
    # Because the refresh token sits in an ordinary readable cookie, this is the EASIEST
    # of the three books to connect: the existing cookie-reading `connect` machinery can
    # take it as-is, where Sportsbet's location was never established and TAB's lives in
    # localStorage.
    #
    # The token endpoint lives on a SEPARATE auth host, not on the api.ladbrokes.com.au
    # data host — which is why every guess against the data host returned go-micro's
    # "none available". Derived 2026-08-27 from the live site's `window.__config`:
    #   auth.url       = https://authentication.neds.com/auth   (config, authoritative)
    #   auth.clientId  = web-frontend                           (PUBLIC client, no secret)
    #   auth.defaultClient = hydra                              (ORY-Hydra-style server)
    #   activeTokenRefreshThreshold = 0.75                      (refresh-token flow confirmed)
    # The app bundle joins that base with a "/token" suffix and posts grant_type /
    # refresh_token / client_id, so the endpoint is authentication.neds.com/auth/token.
    #
    # STILL NOT round-tripped: the auth host sits behind Kasada (`auth.kasada: true`),
    # which drops both server-side curl (empty body) and scripted browser fetch
    # ("Failed to fetch", no CORS + no x-kpsdk header) — so a bogus-token probe could not
    # be executed to confirm the exact status/shape. Host + base + suffix + public client
    # + refresh grant are all config-confirmed; the precise path (/auth/token) and the
    # Kasada header requirement are the residual unknowns. A real unattended refresh will
    # likely need a Kasada token attached, exactly as the web client does. Until proven,
    # put a current access token in ENTAIN_ACCESS_TOKEN and accept it dies within the hour.
    #
    # WIRING NOTE for whoever proves the refresh: this is a PUBLIC client, and OAuth2
    # requires a public client to send `client_id` in the token body. The value is the
    # fixed public constant `web-frontend` (not a secret) — but the schema only carries
    # `client_id_env`, so either set ENTAIN_CLIENT_ID=web-frontend and add client_id_env
    # here, or extend the schema with a literal public client_id. It is deliberately NOT
    # set yet because the endpoint is unproven and doing so would imply it works.
    account:
      type: oauth_refresh
      token_url: https://authentication.neds.com/auth/token
      grant: refresh_token
      refresh_token_env: ENTAIN_REFRESH_TOKEN
      optional: true
  # Used by `sportsdata-mcp refresh-hashes entain`: operation documents are
  # extracted from the current production JS bundle, printed, hashed, and
  # registered with the gateway; the printed texts land in
  # entain.documents.json so the runtime can self-heal APQ cache evictions.
  hash_refresh:
    bundle_host: "https://www.ladbrokes.com.au"
    bundle_url_pattern: "/assets/vendor-graphql-ops-web-*.js"

endpoints:
  # ─── entain.rest (13) — go-micro JSON gateway on api.ladbrokes.com.au ──
  - name: entain_quicklinks_list
    group: entain.rest
    # Deliberately untagged. Site chrome — navigation trees, CMS copy and feature flags.
    # Provider-specific by nature: no other book answers "what is in this one's menu".
    capabilities: []
    summary: "Navigation quick-links (racing/sports nav tiles)."
    base: default
    path: /v2/domain-featured/domain-featured-v2/ListQuickLinks
    auth: default
    params:
      - { name: filter, in: query, type: json, required: true, description: 'QuickLinkFilter, e.g. {"type":"Racing"}. Passing a bare string returns 500.' }
    response_hint: "{quick_links:[{id, root_category_id, category_id, url, title, icon, priority}]}"
    examples:
      - description: "Racing quick-links"
        params: {filter: {type: "Racing"}}

  - name: entain_featured_slider
    group: entain.rest
    # Deliberately untagged. Editorial opinion from ONE book (tips, featured picks, best
    # bets). Not interchangeable with another book's opinion — asking for "tips" should
    # return a named source, never a blend of them.
    capabilities: []
    summary: "Featured slider events (homepage hero carousel)."
    base: default
    path: /v2/domain-featured/DomainFeatured/featured-slider-events
    auth: default
    response_hint: "{items:[{id, title, url, event_id, event:{competition_id, event_start}}]}"

  - name: entain_racing_meeting
    group: entain.rest
    capabilities: [racing.meetings_by_date]
    summary: "All race meetings + races for one date (normalised UUID-keyed tables)."
    base: default
    path: /v2/racing/meeting
    auth: default
    params:
      - { name: date, in: query, type: string, required: true, description: "Race date, YYYY-MM-DD." }
      - { name: timezone, in: query, type: string, required: true, description: "IANA timezone, e.g. Australia/Melbourne." }
    response_hint: "{compounds, domestic_countries, meetings:{}, races:{}, venues:{}}"
    examples:
      - description: "Melbourne card for a given day"
        params: {date: "{{today}}", timezone: "Australia/Melbourne"}

  - name: entain_racing_next_races
    group: entain.rest
    capabilities: [racing.next_to_jump]
    summary: "Next races about to jump, grouped per racing category."
    base: default
    path: /v2/racing/next-races-category-group
    auth: default
    params:
      - { name: count, in: query, type: integer, required: true, description: "Races per category." }
      - { name: categories, in: query, type: json, required: true, description: "JSON array of racing category UUIDs." }
    response_hint: "{category_race_map:{}, race_summaries:{<race_id>:{race_name, meeting_name, advertised_start, race_form}}}"

  - name: entain_racing_racecard
    group: entain.rest
    capabilities: [racing.race_card]
    summary: "Full priced racecard for one race — entrants, fixed-odds fluctuations, form."
    base: default
    path: /rest/v1/racing/
    auth: default
    # A GET, so the 60s response cache would serve the same prices to every poll. Live
    # racing prices move in seconds and the board polls far faster than the cache TTL, so
    # a cached racecard makes fast polling silently pointless — the numbers simply do not
    # change. Same reasoning as entain_sgm_price. Prices are never cached.
    never_cache: true
    params:
      - { name: method, in: query, type: string, default: "racecard", description: "Upstream RPC method (racecard)." }
      - { name: id, in: query, type: string, required: true, description: "Race UUID from the meetings route." }
    response_hint: "{status, data:{races:{}, markets:{}, prices:{}, entrants:{}, price_fluctuations:{<entrant_id>:[floats — LAST is the live fixed win price]}, meetings:{}}}"
    examples:
      - description: "One priced racecard"
        params: {id: "7f553143-1ed4-4ef8-a622-46c7563e6c83"}

  - name: entain_racing_search
    group: entain.rest
    # Deliberately untagged. Free-text search over THIS provider's own catalogue. Scopes
    # and result shapes are not comparable, so a shared tag would promise substitutability
    # that does not hold.
    capabilities: []
    summary: "Racing search facets (barrier/country/jockey/trainer buckets); optional full-text."
    base: default
    path: /v2/racing/search
    auth: default
    params:
      - { name: q, in: query, type: string, description: "Optional full-text query." }
      - { name: category_ids, in: query, type: json, description: "Optional JSON array of category UUIDs to filter." }
    response_hint: "{facets:{barrier:{buckets}, country:{buckets}, jockey:{buckets}, trainer:{buckets}}}"

  - name: entain_racing_future_markets
    group: entain.rest
    capabilities: [racing.futures]
    summary: "Legacy v1 racing RPC selector (future-markets races feed)."
    base: default
    path: /rest/v1/racing/
    auth: default
    params:
      - { name: method, in: query, type: string, default: "future-markets", description: "Upstream RPC method (observed: future-markets)." }
      - { name: exclude, in: query, type: json, description: 'Field mask, e.g. {"markets":true,"prices":true,"entrants":true}.' }
    response_hint: "{status, data:{races:{<race_id>:{name, advertised_start:{seconds}}}}}"

  - name: entain_sport_event_card
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Complete event card — every market, selection and price for one sport event."
    base: default
    path: /v2/sport/event-card
    auth: default
    params:
      - { name: id, in: query, type: string, required: true, description: "Sport event UUID (bare, no type prefix)." }
    response_hint: "{entrants:{}, events:{}, markets:{}, prices:{}, regions:{}, market_type_groups:{}}"
    examples:
      - description: "One NBA event card"
        params: {id: "339e26d0-72a8-49bc-a85f-a2d02c0a1a70"}

  - name: entain_sport_event_request
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Bulk events + markets + prices for one or more sport categories."
    base: default
    path: /v2/sport/event-request
    auth: default
    params:
      - { name: category_ids, in: query, type: json, required: true, description: "JSON array of sport category UUIDs." }
    response_hint: "{events:{}, markets:{}, prices:{}, entrants:{}, next_events:[], regions:{}}"

  - name: entain_sgm_price
    group: entain.rest
    capabilities: [sport.same_game_multi, sport.prices]
    summary: "PRICE A SAME GAME MULTI you choose — give it selections from one Entain (Ladbrokes/Neds) event, get the correlation-adjusted combined price. Prices combinations the book has not pre-built (for those, see entain_graphql_call SportingEventPopularSameGameMultis). Several events can be priced in one call."
    base: default
    path: /v2/same-game-multi/GetOdds
    auth: default
    # A GET, so the response cache would happily serve a stale quote. A price re-read from
    # cache defeats the re-price check automated betting depends on — the comparison comes
    # out equal because it is the same number. Prices are never cached.
    never_cache: true
    params:
      - { name: same_game_multies, in: query, type: json, required: true, description: 'The whole request envelope: a MAP KEYED BY EVENT ID whose value repeats that id. {"<eventId>": {"event_id": "<eventId>", "selections": [{"market_id": "…", "entrant_id": "…"}, …]}}. THE KEY AND THE INNER `event_id` MUST BE THE SAME STRING — they are not redundant, a mismatch is a 400 saying so. Both ids per selection come from entain_sport_event_card: `market_id` is a key of `markets`, `entrant_id` a key of `entrants` (whose own `market_id` must be that market). More than one event may be priced in a single call — that is what the map is for — and each is answered independently under its own key.' }
    response_hint: "{prices:{<eventId>:{available: true, odds:{numerator: 27, denominator: 10}}}}  — keyed by event id, one entry per event you asked about. VERIFIED live 2026-08-27 against AFL Melbourne v Carlton (event eccdc4f5-e01e-4aca-afab-570869b53702), unauthenticated.\n\nODDS ARE FRACTIONAL AND DECIMAL = numerator/denominator + 1. `27/10` is 3.70 — not 2.7, and not 27. Confirmed against the site's own displayed prices on the same event: Melbourne showed 2.15 and returns 23/20, Over showed 1.88 and returns 22/25. Every price in entain_sport_event_card is the same shape, so the conversion is the provider's convention rather than this endpoint's quirk. FORGETTING THE +1 UNDERSTATES EVERY PRICE.\n\nTHE PRICE IS NOT THE PRODUCT OF THE LEGS. Melbourne (2.15) with Over 173.5 (1.88) prices 3.70, against a naive 4.042.\n\nIT SILENTLY COLLAPSES A REDUNDANT LEG AND STILL SAYS `available: true`. Melbourne to win plus Melbourne on the line returned 23/20 — 2.15, the SINGLE-LEG price — with no echo of the legs and nothing marking the drop. Repeating one selection twice does the same. There is no leg list in the response, so RESTATE THE SELECTIONS YOU SENT whenever you report a price, and treat a price equal to a shorter combination's as a collapse.\n\nSOME IMPOSSIBLE COMBINATIONS ARE QUOTED RATHER THAN REFUSED, AT BIG PRICES. The conflict detector is good but not complete. Every exactly-two-entrant SGM-available market on the verified event was tested (41 of them): 35 correctly refused their mutually exclusive pair, and FIVE priced it — Match Betting, both teams to win, at 146.51, plus each of the four Quarter Match Betting markets at 70-82. The failing set is the WIN-MARKET FAMILY with two entrants and an implicit draw; the three-entrant version that lists Tie as an entrant (1st Half Betting) is refused correctly.\n\nTWO CLIENT-SIDE DEFENCES, because nothing in the payload marks exclusivity. FIRST, honour `same_game_multi_available` from entain_sport_event_card — THE PRICER IGNORES ITS OWN FLAG (12 of 14 markets marked unavailable were priced anyway, including the two worst impossible quotes, Highest Scoring Half at 143.65 and 1st Half Match Betting at 110.18). SECOND, do not combine two legs from the SAME `market_id` unless you know that market permits it: every hole found is a same-market pair. Legitimate same-market pairs do exist — nested Alternate Handicaps/Totals lines, and multi-winner props like Anytime Goal Kicker — so a blanket rule costs a little coverage and removes the whole class.\n\nDO NOT USE `num_winners` FOR THIS. It was tried and it does not mean exclusivity in either direction: Melbourne Alternate Handicaps is num_winners 1 with 96 nested lines that legitimately combine, while Race To 15 is num_winners 3 with two mutually exclusive entrants.\n\nA bet that cannot win, quoted at 146.51, looks exactly like a longshot with enormous edge, which is what an automated screener selects for. Never trust `available: true` as proof a combination is coherent.\n\nWHEN IT DOES DETECT A CLASH IT IS THE BEST DIAGNOSTIC OF ANY BOOK HERE: `{available: false, conflicting_selections:[{market_id, entrant_id}, …]}` names the exact pair. It correctly refused Over with Under, both line sides, two margin bands, and cross-market impossibilities like `Melbourne to win` with `Carlton by 1-39`.\n\n`available: false` WITH NO `odds` KEY is also what an unknown event returns, quietly and alongside the events that did price. Unlike the other Australian books there is no fake zero to guard against — a refusal simply has no number — but a missing `odds` must never be read as 0.\n\nMalformed requests are real HTTP 400s naming the problem: a selection missing `market_id` or `entrant_id`, and `event id must match key` when the map key and the inner `event_id` disagree."
    examples:
      - description: "Price Melbourne to win with over 173.5 points"
        params:
          same_game_multies:
            "eccdc4f5-e01e-4aca-afab-570869b53702":
              event_id: "eccdc4f5-e01e-4aca-afab-570869b53702"
              selections:
                - { market_id: "c73591e5-b00e-4c92-abfb-b3737acbdd30", entrant_id: "49475673-c7b8-4b49-8c87-e14637ebfa5c" }
                - { market_id: "2bc6b298-4fce-4545-93cd-ed232a9c69a0", entrant_id: "8ada7d51-2a67-4bcb-9593-f9fcbbbd5188" }

  - name: entain_place_bet
    group: entain.write
    capabilities: []
    method: POST
    summary: "PLACE A REAL BET WITH REAL MONEY on your own Ladbrokes/Neds account. Irreversible. Price with entain_sgm_price first and send those odds — this endpoint takes odds you assert."
    base: default
    path: /v2/betting/place-bet
    auth: account
    params:
      - { name: stake, in: body, type: number, required: true, description: "The stake, as a NUMBER (2 and 1 on the verified bets). Compare the response's `accepted_stake` against this — Entain may take less than asked." }
      - { name: bets, in: body, type: json, required: true, description: 'The bets: [{"legs": [{"bet_id", "entrant_name", "odds": {"numerator", "denominator", "decimal"}, "product_type_id", "root_category_id", "selections": [{"position", "market_id", "event_id", "entrant_id"}]}]}]. `market_id` and `entrant_id` are the SAME identifiers entain_sport_event_card and entain_sgm_price use, so one resolution serves pricing and placing. A SAME GAME MULTI is several `legs` in one bet PLUS a `prices` object on that bet keyed by EVENT ID: {"prices": {"<event_id>": {"valid": true, "odds": {"numerator", "denominator"}}}} carrying the combined price — a single carries no `prices` block at all. That was the shape of the verified three-leg SGM.' }
    response_hint: "{transaction_id, status: 'accepted', accepted_stake, message, placed_odds:[{product_type_id, odds:{decimal, numerator, denominator}}]}  — VERIFIED live 2026-08-27 on real bets, a single and a three-leg same game multi, both HTTP 200 with status 'accepted'.\n\nHTTP 200 IS NOT THE ANSWER — `status` IS. Entain returns 200 and puts the verdict in the body: 'accepted' on both verified bets, with `message` alongside. Treat anything other than 'accepted' as a bet that did not go on, whatever the status code said.\n\nCHECK `accepted_stake` AGAINST WHAT YOU SENT. Entain states the stake it actually took, and a book is entitled to take less than asked — on a limited account that is normal, not an error. Both verified bets matched, but a plane that assumes they always will is one that reports a $50 bet it never had.\n\nCHECK `placed_odds` AGAINST WHAT YOU PRICED. The odds actually struck come back, so price drift is detectable from the placement response alone — no separate read-back needed to answer 'what did I get'.\n\n`transaction_id` is RETURNED, not sent. It is a receipt, NOT an idempotency key — unlike TAB, where you generate one and can safely resend it. There is no observed way to ask Entain whether a timed-out placement landed, so treat this endpoint like Sportsbet's: never retry, and VERIFY by reading the account instead.\n\nSO: CONFIRM EVERY PLACEMENT from the response before reporting it — `status` must be 'accepted', `accepted_stake` must match what you sent, and `placed_odds` must match what you priced. All three, not one."

  - name: entain_event_market_rules
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Settlement rules for every named market, indexed by rule id."
    base: default
    path: /v2/event/MarketRules
    auth: default
    response_hint: "{market_rules:{<rule_id>:{id, name, description}}}"

  - name: entain_event_market_type_groups
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Market-tab group definitions for a sport category (lower priority renders first)."
    base: default
    path: /v2/event/MarketTypeGroupsByCategoryID
    auth: default
    params:
      - { name: category_id, in: query, type: string, required: true, description: "Sport category UUID." }
    response_hint: "{market_type_group:[{id, category_id, name, priority, type}]}"

  - name: entain_event_market_type_group_maps
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Join table between market types and market-type groups (dedup by pair)."
    base: default
    path: /v2/event/MarketTypeGroupMapsByCategoryID
    auth: default
    params:
      - { name: category_id, in: query, type: string, required: true, description: "Sport category UUID." }
    response_hint: "{market_type_group_map:[{market_type_id, market_type_group_id, priority}]}"

  - name: entain_metadata_by_url
    group: entain.rest
    # Deliberately untagged. Site chrome — navigation trees, CMS copy and feature flags.
    # Provider-specific by nature: no other book answers "what is in this one's menu".
    capabilities: []
    summary: "SEO metadata (page title) for a given URL path."
    base: default
    path: /v2/metadata/GetByURL
    auth: default
    params:
      - { name: url, in: query, type: string, required: true, description: "URL path, e.g. /racing." }
    response_hint: "{metadata:{title, url}} (empty {} when no override)"

  - name: entain_video_channels
    group: entain.rest
    capabilities: [sport.live_video]
    summary: "Racing live-video channels (HLS .m3u8 URLs; verify token expires within minutes)."
    base: default
    path: /v2/video/video-v2/ListChannels
    auth: default
    response_hint: "{channels:[{id, name, url}]}"

  # ─── entain.cdn (1) — Contentful CMS proxy on the www host ─────────────
  - name: entain_cms_entries
    group: entain.cdn
    capabilities: [content.promo]
    summary: "Contentful CMS entries (promotions, major-event nav) via the www CDN proxy."
    base: cms
    path: /cdn/contentful/api/spaces/5pu2kqpl2a5n/environments/master/entries
    auth: default
    params:
      - { name: content_type, in: query, type: string, description: "Contentful content type, e.g. promotions, majorEventNavigation, nationallyApprovedPromotions." }
      - { name: include, in: query, type: integer, description: "Linked-entry resolution depth (Contentful CDA)." }
      - { name: skip, in: query, type: integer, description: "Pagination offset (Contentful CDA)." }
      - { name: limit, in: query, type: integer, description: "Page size (Contentful CDA)." }
      - { name: order, in: query, type: string, description: "Sort order field (Contentful CDA)." }
    response_hint: "{sys, total, skip, limit, items:[{sys, fields}], includes:{}}"
    examples:
      - description: "Active promotions"
        params: {content_type: "promotions", limit: 20}

dispatchers:
  # ─── entain.graphql — 127 persisted operations on /gql/router ──────────
  - name: entain_graphql_call
    group: entain.graphql
    capabilities:
      [racing.race_card, racing.next_to_jump, racing.same_race_multi, sport.competition_screen, sport.event_markets, sport.prices, sport.in_play, sport.same_game_multi]
    kind: graphql_persisted
    summary: |
      Call any of Entain's 127 persisted GraphQL operations against
      api.ladbrokes.com.au/gql/router by name + variables. Hashes are managed
      server-side; a PERSISTED_QUERY_NOT_FOUND (gateway APQ-cache eviction) is
      self-healed automatically by re-POSTing the stored query document. If it
      still surfaces, run `sportsdata-mcp refresh-hashes entain`. GraphQL IDs are
      type-prefixed (RacingRace:<uuid>, SportingEvent:<uuid>): variable type
      ID! wants the prefixed form, UUID! wants the bare uuid. Read
      entain://graphql/operations for the full op list + variable signatures.
    method: GET
    endpoint: /gql/router
    auth: default
    catalog_resource: "entain://graphql/operations"
    params:
      - { name: operation, in: dispatch, type: string, required: true, description: "GraphQL operation name (see entain://graphql/operations)" }
      - { name: variables, in: dispatch, type: object, required: false, description: "Operation variables, e.g. {id: 'RacingRaceCard:179247bf-...', isLoggedIn: false, includePlaceExtra: false}" }

graphql:
  operations:
    - { name: AccountBetTransaction, sha256: "be9a0c8f6718e80f5a940c72c02fca840b4ae35b6573470d7a916e3e4075111f", variables: "transactionId: ID!" }
    - { name: AccountGetBetCombinations, sha256: "88bc8db19cc5b60eefb6bfe5c7c46d101f6abb4e2548dd7bb6834b2302d45ac2", variables: "id: ID!, groupId: String, first: Int, after: String" }
    - { name: AccountGetBetTransaction, sha256: "5d1d864fdc1ad3fbf1a19468ed7ca9e904fe05657af7fe0208787082d678c259", variables: "id: ID!, groupId: String, includeCashOutCheck: Boolean, includeEntrantTrackers: Boolean, includeMultisPreview: Boolean, eventId: UUID" }
    - { name: AccountListPendingBetTransactions, sha256: "6e66f585caa10998eaca19c2fd317a9f929b4420956bb199da3b93105293b042", variables: "groupId: String, first: Int, after: String, orderBy: PendingBetsSortOrder, includeCashOutChecks: Boolean, includeMultisPreview: Boolean, eventId: UUID" }
    - { name: AccountListResultedBetTransactions, sha256: "f1d11ba9553b313f28a49936d57d1dfdcee1d36e2c8650c6653a8672abc477b8", variables: "first: Int, after: String, betStatuses: [BetStatus!], groupId: String, includeMultisPreview: Boolean" }
    - { name: BetStakeLimit, sha256: "ae61efdedef97b5ea457a61b92a5faee45c8aefe29909dd3fbce214d00866761", variables: "" }
