spec_version: 1

provider:
  id: entain
  display_name: "Entain (Ladbrokes / Neds Australia)"
  # Licensed for the Australian market and geo-blocked elsewhere.
  region: [AU]
  doc_url: "https://github.com/DanielTomaro13/sportsdata-mcp/blob/main/documentation/Entain.md"
  base_urls:
    default: https://api.ladbrokes.com.au
    # The Contentful CMS + form guides are proxied through the www host, NOT the API host.
    cms: https://www.ladbrokes.com.au
  # Content-Type: application/json is required on EVERY request — including GET.
  # Without it the go-micro gateway returns HTTP 500 `unsupported content-type`.
  default_headers:
    User-Agent: "Mozilla/5.0 (compatible; sportsdata-mcp/0.1)"
    Origin: https://www.ladbrokes.com.au
    Referer: https://www.ladbrokes.com.au/
    Content-Type: application/json
  auth:
    default:
      type: none
  # Used by `sportsdata-mcp refresh-hashes entain`: operation documents are
  # extracted from the current production JS bundle, printed, hashed, and
  # registered with the gateway; the printed texts land in
  # entain.documents.json so the runtime can self-heal APQ cache evictions.
  hash_refresh:
    bundle_host: "https://www.ladbrokes.com.au"
    bundle_url_pattern: "/assets/vendor-graphql-ops-web-*.js"

endpoints:
  # ─── entain.rest (13) — go-micro JSON gateway on api.ladbrokes.com.au ──
  - name: entain_quicklinks_list
    group: entain.rest
    # Deliberately untagged. Site chrome — navigation trees, CMS copy and feature flags.
    # Provider-specific by nature: no other book answers "what is in this one's menu".
    capabilities: []
    summary: "Navigation quick-links (racing/sports nav tiles)."
    base: default
    path: /v2/domain-featured/domain-featured-v2/ListQuickLinks
    auth: default
    params:
      - { name: filter, in: query, type: json, required: true, description: 'QuickLinkFilter, e.g. {"type":"Racing"}. Passing a bare string returns 500.' }
    response_hint: "{quick_links:[{id, root_category_id, category_id, url, title, icon, priority}]}"
    examples:
      - description: "Racing quick-links"
        params: {filter: {type: "Racing"}}

  - name: entain_featured_slider
    group: entain.rest
    # Deliberately untagged. Editorial opinion from ONE book (tips, featured picks, best
    # bets). Not interchangeable with another book's opinion — asking for "tips" should
    # return a named source, never a blend of them.
    capabilities: []
    summary: "Featured slider events (homepage hero carousel)."
    base: default
    path: /v2/domain-featured/DomainFeatured/featured-slider-events
    auth: default
    response_hint: "{items:[{id, title, url, event_id, event:{competition_id, event_start}}]}"

  - name: entain_racing_meeting
    group: entain.rest
    capabilities: [racing.meetings_by_date]
    summary: "All race meetings + races for one date (normalised UUID-keyed tables)."
    base: default
    path: /v2/racing/meeting
    auth: default
    params:
      - { name: date, in: query, type: string, required: true, description: "Race date, YYYY-MM-DD." }
      - { name: timezone, in: query, type: string, required: true, description: "IANA timezone, e.g. Australia/Melbourne." }
    response_hint: "{compounds, domestic_countries, meetings:{}, races:{}, venues:{}}"
    examples:
      - description: "Melbourne card for a given day"
        params: {date: "{{today}}", timezone: "Australia/Melbourne"}

  - name: entain_racing_next_races
    group: entain.rest
    capabilities: [racing.next_to_jump]
    summary: "Next races about to jump, grouped per racing category."
    base: default
    path: /v2/racing/next-races-category-group
    auth: default
    params:
      - { name: count, in: query, type: integer, required: true, description: "Races per category." }
      - { name: categories, in: query, type: json, required: true, description: "JSON array of racing category UUIDs." }
    response_hint: "{category_race_map:{}, race_summaries:{<race_id>:{race_name, meeting_name, advertised_start, race_form}}}"

  - name: entain_racing_racecard
    group: entain.rest
    capabilities: [racing.race_card]
    summary: "Full priced racecard for one race — entrants, fixed-odds fluctuations, form."
    base: default
    path: /rest/v1/racing/
    auth: default
    params:
      - { name: method, in: query, type: string, default: "racecard", description: "Upstream RPC method (racecard)." }
      - { name: id, in: query, type: string, required: true, description: "Race UUID from the meetings route." }
    response_hint: "{status, data:{races:{}, markets:{}, prices:{}, entrants:{}, price_fluctuations:{<entrant_id>:[floats — LAST is the live fixed win price]}, meetings:{}}}"
    examples:
      - description: "One priced racecard"
        params: {id: "7f553143-1ed4-4ef8-a622-46c7563e6c83"}

  - name: entain_racing_search
    group: entain.rest
    # Deliberately untagged. Free-text search over THIS provider's own catalogue. Scopes
    # and result shapes are not comparable, so a shared tag would promise substitutability
    # that does not hold.
    capabilities: []
    summary: "Racing search facets (barrier/country/jockey/trainer buckets); optional full-text."
    base: default
    path: /v2/racing/search
    auth: default
    params:
      - { name: q, in: query, type: string, description: "Optional full-text query." }
      - { name: category_ids, in: query, type: json, description: "Optional JSON array of category UUIDs to filter." }
    response_hint: "{facets:{barrier:{buckets}, country:{buckets}, jockey:{buckets}, trainer:{buckets}}}"

  - name: entain_racing_future_markets
    group: entain.rest
    capabilities: [racing.futures]
    summary: "Legacy v1 racing RPC selector (future-markets races feed)."
    base: default
    path: /rest/v1/racing/
    auth: default
    params:
      - { name: method, in: query, type: string, default: "future-markets", description: "Upstream RPC method (observed: future-markets)." }
      - { name: exclude, in: query, type: json, description: 'Field mask, e.g. {"markets":true,"prices":true,"entrants":true}.' }
    response_hint: "{status, data:{races:{<race_id>:{name, advertised_start:{seconds}}}}}"

  - name: entain_sport_event_card
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Complete event card — every market, selection and price for one sport event."
    base: default
    path: /v2/sport/event-card
    auth: default
    params:
      - { name: id, in: query, type: string, required: true, description: "Sport event UUID (bare, no type prefix)." }
    response_hint: "{entrants:{}, events:{}, markets:{}, prices:{}, regions:{}, market_type_groups:{}}"
    examples:
      - description: "One NBA event card"
        params: {id: "339e26d0-72a8-49bc-a85f-a2d02c0a1a70"}

  - name: entain_sport_event_request
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Bulk events + markets + prices for one or more sport categories."
    base: default
    path: /v2/sport/event-request
    auth: default
    params:
      - { name: category_ids, in: query, type: json, required: true, description: "JSON array of sport category UUIDs." }
    response_hint: "{events:{}, markets:{}, prices:{}, entrants:{}, next_events:[], regions:{}}"

  - name: entain_event_market_rules
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Settlement rules for every named market, indexed by rule id."
    base: default
    path: /v2/event/MarketRules
    auth: default
    response_hint: "{market_rules:{<rule_id>:{id, name, description}}}"

  - name: entain_event_market_type_groups
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Market-tab group definitions for a sport category (lower priority renders first)."
    base: default
    path: /v2/event/MarketTypeGroupsByCategoryID
    auth: default
    params:
      - { name: category_id, in: query, type: string, required: true, description: "Sport category UUID." }
    response_hint: "{market_type_group:[{id, category_id, name, priority, type}]}"

  - name: entain_event_market_type_group_maps
    group: entain.rest
    capabilities: [sport.event_markets]
    summary: "Join table between market types and market-type groups (dedup by pair)."
    base: default
    path: /v2/event/MarketTypeGroupMapsByCategoryID
    auth: default
    params:
      - { name: category_id, in: query, type: string, required: true, description: "Sport category UUID." }
    response_hint: "{market_type_group_map:[{market_type_id, market_type_group_id, priority}]}"

  - name: entain_metadata_by_url
    group: entain.rest
    # Deliberately untagged. Site chrome — navigation trees, CMS copy and feature flags.
    # Provider-specific by nature: no other book answers "what is in this one's menu".
    capabilities: []
    summary: "SEO metadata (page title) for a given URL path."
    base: default
    path: /v2/metadata/GetByURL
    auth: default
    params:
      - { name: url, in: query, type: string, required: true, description: "URL path, e.g. /racing." }
    response_hint: "{metadata:{title, url}} (empty {} when no override)"

  - name: entain_video_channels
    group: entain.rest
    capabilities: [sport.live_video]
    summary: "Racing live-video channels (HLS .m3u8 URLs; verify token expires within minutes)."
    base: default
    path: /v2/video/video-v2/ListChannels
    auth: default
    response_hint: "{channels:[{id, name, url}]}"

  # ─── entain.cdn (1) — Contentful CMS proxy on the www host ─────────────
  - name: entain_cms_entries
    group: entain.cdn
    capabilities: [content.promo]
    summary: "Contentful CMS entries (promotions, major-event nav) via the www CDN proxy."
    base: cms
    path: /cdn/contentful/api/spaces/5pu2kqpl2a5n/environments/master/entries
    auth: default
    params:
      - { name: content_type, in: query, type: string, description: "Contentful content type, e.g. promotions, majorEventNavigation, nationallyApprovedPromotions." }
      - { name: include, in: query, type: integer, description: "Linked-entry resolution depth (Contentful CDA)." }
      - { name: skip, in: query, type: integer, description: "Pagination offset (Contentful CDA)." }
      - { name: limit, in: query, type: integer, description: "Page size (Contentful CDA)." }
      - { name: order, in: query, type: string, description: "Sort order field (Contentful CDA)." }
    response_hint: "{sys, total, skip, limit, items:[{sys, fields}], includes:{}}"
    examples:
      - description: "Active promotions"
        params: {content_type: "promotions", limit: 20}

dispatchers:
  # ─── entain.graphql — 127 persisted operations on /gql/router ──────────
  - name: entain_graphql_call
    group: entain.graphql
    capabilities:
      [racing.race_card, racing.next_to_jump, racing.same_race_multi, sport.competition_screen, sport.event_markets, sport.prices, sport.in_play, sport.same_game_multi]
    kind: graphql_persisted
    summary: |
      Call any of Entain's 127 persisted GraphQL operations against
      api.ladbrokes.com.au/gql/router by name + variables. Hashes are managed
      server-side; a PERSISTED_QUERY_NOT_FOUND (gateway APQ-cache eviction) is
      self-healed automatically by re-POSTing the stored query document. If it
      still surfaces, run `sportsdata-mcp refresh-hashes entain`. GraphQL IDs are
      type-prefixed (RacingRace:<uuid>, SportingEvent:<uuid>): variable type
      ID! wants the prefixed form, UUID! wants the bare uuid. Read
      entain://graphql/operations for the full op list + variable signatures.
    method: GET
    endpoint: /gql/router
    auth: default
    catalog_resource: "entain://graphql/operations"
    params:
      - { name: operation, in: dispatch, type: string, required: true, description: "GraphQL operation name (see entain://graphql/operations)" }
      - { name: variables, in: dispatch, type: object, required: false, description: "Operation variables, e.g. {id: 'RacingRaceCard:179247bf-...', isLoggedIn: false, includePlaceExtra: false}" }

