spec_version: 1

# Data Golf (datagolf.com) — golf analytics + model predictions + cross-book betting
# odds. The API is feeds.datagolf.com; every call authenticates with a personal
# `?key=` query parameter tied to a paid subscription. The key is a SECRET — it is
# sourced from the DATAGOLF_KEY env var via the `static_query` auth scheme and never
# stored in this spec. (Set DATAGOLF_KEY, or put it in the config `secrets` block.)
#
# Tours: pga, euro (DP World), kft (Korn Ferry), alt, liv. Most endpoints take
# `file_format=json` (carried as a default). Some endpoints require a higher data
# tier; a 403/permission error means the key's plan doesn't include that feed.

provider:
  id: datagolf
  display_name: "Data Golf"
  # Runs on OUR paid key — a licensed build routes it through the entitlement proxy
  # (the key never ships). If the customer sets DATAGOLF_KEY, they go direct.
  proxied: true
  byo_key_env: DATAGOLF_KEY
  doc_url: "https://github.com/DanielTomaro13/sportsdata-mcp/blob/main/documentation/DataGolf.md"
  base_urls:
    default: https://feeds.datagolf.com
  default_headers:
    User-Agent: "Mozilla/5.0 (compatible; sportsdata-mcp/0.1)"
    Accept: "application/json"
  auth:
    default:
      type: static_query
      param: key
      env: DATAGOLF_KEY
  defaults:
    rate_limit_rps: 3
    request_timeout_seconds: 30
    retry_statuses: [429, 500, 502, 503, 504]
    max_retries: 2
    retry_backoff_seconds: 0.5

endpoints:
  # ─── datagolf.general — players, schedule, field ──────────────────────
  - name: datagolf_player_list
    group: datagolf.general
    capabilities: [ref.players]
    summary: "Full player list with Data Golf ids (dg_id), name, country, amateur flag."
    base: default
    path: /get-player-list
    auth: default
    params:
      - { name: file_format, in: query, type: string, default: json, description: "Response format (leave json)." }
    response_hint: "[{dg_id, player_name, country, country_code, amateur}]  (top-level array)"

  - name: datagolf_schedule
    group: datagolf.general
    capabilities: [ref.seasons]
    summary: "Tour schedule — the season's events with dates, courses and locations."
    base: default
    path: /get-schedule
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{schedule:[{event_id, event_name, course, course_key, location, country, latitude, longitude, start_date}]}"

  - name: datagolf_field_updates
    group: datagolf.general
    capabilities: [sport.match_detail]
    summary: "Current event field — players entered, tee times, withdrawals, current round."
    base: default
    path: /field-updates
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_name, event_id, course_name, current_round, date_start, date_end, field:[{dg_id, player_name, ...tee times}]}"

  # ─── datagolf.predictions — rankings, model preds, live stats ─────────
  - name: datagolf_rankings
    group: datagolf.predictions
    summary: "Data Golf player rankings (top ~500) with skill estimate and OWGR rank."
    base: default
    path: /preds/get-dg-rankings
    auth: default
    params:
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{last_updated, rankings:[{datagolf_rank, owgr_rank, dg_id, player_name, dg_skill_estimate, country}]}"

  - name: datagolf_pre_tournament
    group: datagolf.predictions
    summary: "Pre-tournament model predictions — win / top-5/10/20 / make-cut probabilities per player."
    base: default
    path: /preds/pre-tournament
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: odds_format, in: query, type: string, default: percent, enum: [percent, decimal, american, fraction], description: "How probabilities/odds are expressed." }
      - { name: add_position, in: query, type: string, description: "Extra finish positions to include (e.g. '1,2,3')." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{baseline:[{dg_id, player_name, win, top_5, top_10, top_20, make_cut}], baseline_history_fit:[...]}"

  - name: datagolf_in_play
    group: datagolf.predictions
    capabilities: [sport.in_play]
    summary: "Live (in-play) model predictions during a tournament — current position/score + updated win probabilities."
    base: default
    path: /preds/in-play
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: odds_format, in: query, type: string, default: percent, enum: [percent, decimal, american, fraction], description: "Odds/probability format." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{data:[{dg_id, player_name, current_pos, current_score, R1, R2, R3, R4, make_cut, win, ...}]}"

  - name: datagolf_skill_ratings
    group: datagolf.predictions
    capabilities: [stats.advanced_metrics]
    summary: "Player skill ratings — strokes-gained components (off-tee, approach, around-green, putting) + driving acc/dist."
    base: default
    path: /preds/skill-ratings
    auth: default
    params:
      - { name: display, in: query, type: string, default: value, enum: [value, rank], description: "Show raw values or ranks." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{last_updated, players:[{dg_id, player_name, sg_total, sg_ott, sg_app, sg_arg, sg_putt, driving_acc, driving_dist}]}"

  - name: datagolf_approach_skill
    group: datagolf.predictions
    capabilities: [stats.advanced_metrics]
    summary: "Detailed approach-play skill per player across yardage/lie buckets — SG per shot, proximity, GIR, good-shot and poor-shot-avoidance rates."
    base: default
    path: /preds/approach-skill
    auth: default
    params:
      - { name: period, in: query, type: string, default: l24, enum: [l24, l12, ytd], description: "Window: last 24 months, last 12 months, or year-to-date." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{last_updated, time_period, data:[{dg_id, player_name, ...per-bucket sg/proximity/gir fields}]}"

  - name: datagolf_live_strokes_gained
    group: datagolf.predictions
    capabilities: [stats.advanced_metrics, sport.in_play]
    summary: "Live strokes-gained breakdown for every player during PGA Tour events (raw, or relative to the model's pre-round expectations)."
    base: default
    path: /preds/live-strokes-gained
    auth: default
    params:
      - { name: sg, in: query, type: string, default: raw, enum: [raw, relative], description: "Raw SG values, or relative to model predictions." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_name, current_round, last_update, strokes_gained_values, data:[{dg_id, player_name, pos, score, thru, today, R1:{...sg}, R2, R3, R4}]}"

  - name: datagolf_live_tournament_stats
    group: datagolf.predictions
    capabilities: [stats.advanced_metrics, stats.player_match]
    summary: "Live per-player tournament stats (strokes-gained by category, accuracy, etc.) for the requested round."
    base: default
    path: /preds/live-tournament-stats
    auth: default
    params:
      - { name: stats, in: query, type: string_csv, default: "sg_putt,sg_arg,sg_app,sg_ott,sg_t2g,sg_total,distance,accuracy,gir,prox_fw,scrambling", description: "Stat categories to include (CSV)." }
      - { name: round, in: query, type: string, default: event_cumulative, enum: [event_cumulative, event_avg, 1, 2, 3, 4], description: "Which round (or cumulative/average)." }
      - { name: display, in: query, type: string, default: value, enum: [value, rank], description: "Values or ranks." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_name, course_name, last_updated, live_stats:[{dg_id, player_name, sg_total, sg_ott, sg_app, ...}]}"

  - name: datagolf_pre_tournament_archive
    group: datagolf.predictions
    summary: "Archived pre-tournament predictions for a past event (what the model said beforehand)."
    base: default
    path: /preds/pre-tournament-archive
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: event_id, in: query, type: integer, description: "Event id (from get-schedule / historical event lists)." }
      - { name: year, in: query, type: integer, description: "Calendar year of the event." }
      - { name: odds_format, in: query, type: string, default: percent, enum: [percent, decimal, american, fraction], description: "Odds/probability format." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{baseline:[{dg_id, player_name, fin_text, win, make_cut, first_round_leader, top_10}]}"

  - name: datagolf_player_decompositions
    group: datagolf.predictions
    capabilities: [stats.advanced_metrics]
    summary: "Per-player skill decomposition for the current event — how each skill (driving, approach, putting, course-fit) contributes to the prediction."
    base: default
    path: /preds/player-decompositions
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_name, course_name, players:[{dg_id, player_name, ...skill/course-fit components}]}"

  - name: datagolf_fantasy_projections
    group: datagolf.predictions
    capabilities: [stats.fantasy_projections]
    summary: "DFS fantasy-points projections + salaries/ownership for a site + slate."
    base: default
    path: /preds/fantasy-projection-defaults
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: site, in: query, type: string, default: draftkings, enum: [draftkings, fanduel, yahoo], description: "DFS site." }
      - { name: slate, in: query, type: string, default: main, description: "Slate (e.g. main)." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_name, last_updated, projections:[{dg_id, player_name, proj_points, salary, proj_ownership}]}"

  - name: datagolf_live_hole_stats
    group: datagolf.predictions
    capabilities: [stats.advanced_metrics]
    summary: "Live per-hole scoring distributions for the in-progress event (avg score, birdie/bogey rates by hole, AM/PM wave)."
    base: default
    path: /preds/live-hole-stats
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{courses:[{course_code, course_key, rounds:[{round_num, holes:[{hole, par, avg_score, afternoon_wave:{...}, morning_wave:{...}}]}]}]}"

  # ─── datagolf.betting — cross-book odds ───────────────────────────────
  - name: datagolf_outrights
    group: datagolf.betting
    capabilities: [sport.event_markets, sport.prices]
    summary: "Outright (win / top-N / make-cut) odds for the current event across ~13 sportsbooks, plus Data Golf's model line."
    base: default
    path: /betting-tools/outrights
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: market, in: query, type: string, default: win, enum: [win, top_5, top_10, top_20, make_cut, mc, frl], description: "Outright market." }
      - { name: odds_format, in: query, type: string, default: decimal, enum: [decimal, american, fraction, percent], description: "Odds format." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_name, last_updated, books_offering:[...], odds:[{dg_id, player_name, datagolf:{...}, bet365, pinnacle, draftkings, fanduel, ...}]}"

  - name: datagolf_matchups
    group: datagolf.betting
    capabilities: [sport.event_markets, sport.prices]
    summary: "Tournament / round / 3-ball matchup odds across sportsbooks, plus Data Golf's model line."
    base: default
    path: /betting-tools/matchups
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: market, in: query, type: string, default: tournament_matchups, enum: [tournament_matchups, round_matchups, 3_balls], description: "Matchup market." }
      - { name: odds_format, in: query, type: string, default: decimal, enum: [decimal, american, fraction, percent], description: "Odds format." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_name, market, last_updated, match_list:[{p1_player_name, p2_player_name, odds:{datagolf, bet365, pinnacle, ...}}]}"

  - name: datagolf_matchups_all_pairings
    group: datagolf.betting
    capabilities: [sport.event_markets, sport.prices]
    summary: "All possible tournament matchup pairings for the current event with Data Golf's model odds (every player-vs-player price)."
    base: default
    path: /betting-tools/matchups-all-pairings
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: odds_format, in: query, type: string, default: decimal, enum: [decimal, american, fraction, percent], description: "Odds format." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_name, last_update, pairings:[{p1_player_name, p2_player_name, p3_player_name, ...model odds}]}"

  # ─── datagolf.historical — raw data, historical odds, DFS results ──────
  - name: datagolf_hist_event_list
    group: datagolf.historical
    summary: "List of historical events that have raw round-level data available (event_id + year to pass to the rounds feed)."
    base: default
    path: /historical-raw-data/event-list
    auth: default
    params:
      - { name: tour, in: query, type: string, enum: [pga, euro, kft, alt, liv], description: "Optional tour filter." }
      - { name: year, in: query, type: integer, description: "Optional calendar-year filter." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "[{event_id, event_name, tour, calendar_year, date, sg_categories}]  (top-level array)"

  - name: datagolf_hist_rounds
    group: datagolf.historical
    capabilities: [stats.player_match]
    summary: "Historical round-by-round scoring + strokes-gained for every player in a past event."
    base: default
    path: /historical-raw-data/rounds
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: event_id, in: query, type: integer, required: true, description: "Event id (from datagolf_hist_event_list)." }
      - { name: year, in: query, type: integer, required: true, description: "Calendar year of the event." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_id, event_name, event_completed, scores:[{dg_id, player_name, fin_text, rounds:[{round_num, score, sg_total, sg_putt, ...}]}]}"

  - name: datagolf_hist_results_event_list
    group: datagolf.historical
    summary: "List of tournaments with historical event-level results data (finishes/earnings/points) — the id lookup for datagolf_hist_results."
    base: default
    path: /historical-event-data/event-list
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, description: "Tour (PGA only for this feed)." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "[{event_id, event_name, calendar_year, date}]  (top-level array)"

  - name: datagolf_hist_results
    group: datagolf.historical
    summary: "Historical event-level results for a past tournament — finish position, earnings, FedExCup points and DG Points per player."
    base: default
    path: /historical-event-data/events
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, description: "Tour (PGA only for this feed)." }
      - { name: event_id, in: query, type: integer, required: true, description: "Event id (from datagolf_hist_results_event_list)." }
      - { name: year, in: query, type: integer, required: true, description: "Calendar year of the event." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_id, event_name, year, season, event_completed, event_stats:[{dg_id, player_name, fin_text, earnings, fec_points, dg_points}]}"

  - name: datagolf_hist_odds_event_list
    group: datagolf.historical
    summary: "List of historical events that have archived bookmaker odds available."
    base: default
    path: /historical-odds/event-list
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "[{event_id, event_name, calendar_year, archived_preds, ...}]  (top-level array)"

  - name: datagolf_hist_outrights
    group: datagolf.historical
    summary: "Historical opening/closing outright odds for a past event from one sportsbook."
    base: default
    path: /historical-odds/outrights
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: event_id, in: query, type: integer, required: true, description: "Event id." }
      - { name: year, in: query, type: integer, required: true, description: "Calendar year." }
      - { name: market, in: query, type: string, default: win, enum: [win, top_5, top_10, top_20, make_cut, mc, frl], description: "Outright market." }
      - { name: book, in: query, type: string, default: pinnacle, description: "Sportsbook (e.g. pinnacle, bet365, draftkings)." }
      - { name: odds_format, in: query, type: string, default: decimal, enum: [decimal, american, fraction, percent], description: "Odds format." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{book, event_id, event_name, event_completed, outrights:[{dg_id, player_name, open_odds, close_odds, ...}]}"

  - name: datagolf_hist_matchups
    group: datagolf.historical
    summary: "Historical matchup / 3-ball odds for a past event from one sportsbook."
    base: default
    path: /historical-odds/matchups
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: event_id, in: query, type: integer, required: true, description: "Event id." }
      - { name: year, in: query, type: integer, required: true, description: "Calendar year." }
      - { name: book, in: query, type: string, default: pinnacle, description: "Sportsbook." }
      - { name: odds_format, in: query, type: string, default: decimal, enum: [decimal, american, fraction, percent], description: "Odds format." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{book, event_id, event_name, event_completed, matchups:[{p1_player_name, p2_player_name, open_odds, close_odds, ...}]}"

  - name: datagolf_hist_dfs_event_list
    group: datagolf.historical
    summary: "List of historical events with DFS salary/ownership/points data for a site."
    base: default
    path: /historical-dfs-data/event-list
    auth: default
    params:
      - { name: site, in: query, type: string, default: draftkings, enum: [draftkings, fanduel, yahoo], description: "DFS site (this feed keys off site, not tour)." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "[{event_id, event_name, calendar_year, date, dk_salaries, dk_ownerships}]  (top-level array)"

  - name: datagolf_hist_dfs_points
    group: datagolf.historical
    capabilities: [stats.fantasy_projections]
    summary: "Historical DFS points + salary + ownership per player for a past event."
    base: default
    path: /historical-dfs-data/points
    auth: default
    params:
      - { name: tour, in: query, type: string, default: pga, enum: [pga, euro, kft, alt, liv], description: "Tour." }
      - { name: site, in: query, type: string, default: draftkings, enum: [draftkings, fanduel, yahoo], description: "DFS site." }
      - { name: event_id, in: query, type: integer, required: true, description: "Event id." }
      - { name: year, in: query, type: integer, required: true, description: "Calendar year." }
      - { name: file_format, in: query, type: string, default: json, description: "Response format." }
    response_hint: "{event_id, event_name, event_completed, season, dfs_points:[{dg_id, player_name, fin_text, finish_pts, total_pts, salary, ownership}]}"
