      - name: cumestatsplayer
        path: /stats/cumestatsplayer
        query_params: [PlayerID, GameIDs]
        query_defaults: {LeagueID: '00', Season: 2025-26, SeasonType: Regular Season}
        summary: 'CumeStatsPlayer. resultSets: GameByGameStats, TotalPlayerStats.'
      - name: cumestatsplayergames
        path: /stats/cumestatsplayergames
        query_params: [PlayerID]
        query_defaults: {LeagueID: '00', Season: 2025-26, SeasonType: Regular Season, Location: '', Outcome: '', VsConference: '', VsDivision: '', VsTeamID: ''}
        summary: 'CumeStatsPlayerGames. resultSets: CumeStatsPlayerGames.'
      - name: cumestatsteam
        path: /stats/cumestatsteam
        query_params: [TeamID, GameIDs]
        query_defaults: {LeagueID: '00', Season: 2025-26, SeasonType: Regular Season}
        summary: 'CumeStatsTeam. resultSets: GameByGameStats, TotalTeamStats.'
      - name: cumestatsteamgames
        path: /stats/cumestatsteamgames
