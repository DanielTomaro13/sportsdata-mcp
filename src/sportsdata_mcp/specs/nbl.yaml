spec_version: 1

# NBL (nbl.com.au) — Australia's National Basketball League, read directly from
# the site's own data API. Genius Sports powers the underlying stats; nbl.com.au
# fronts them through a Redis-cached proxy ("rosetta"). Probed live 2026-06-26.
#
# HOW IT WORKS: every feed is
#   https://prod.rosetta.nbl.com.au/get/{route}
# No token/API key. The proxy is REFERER-GATED — it 403s ("MISSING_API_KEY", a
# misleading message) unless the request carries an nbl.com.au Origin + Referer.
# Those two headers are baked into the spec, so the feeds return JSON anonymously.
# (The site also has a separate Genius widget proxy at /api_cache/nbl/genius and a
# Directus CMS at /api_cache/nbl/cms with its own Bearer — out of scope here; the
# rosetta stats API below is the data surface.)
#
# Every response is enveloped: {type, fetched, ttlRemaining, count, source, data:[…]}.
#
# SEASON SCOPING: most routes take `year` = the season START year (2025 = "NBL26",
# the current 2025-26 season; 2026 = "NBL27"). `seasonType` ∈ regular | all |
# in_season | preseason | finals. A few stats routes instead need the season UUID
# (`seasonId`) — get it from nbl_seasons (data[].id). The NBL runs Sep–Mar, so
# off-season the "current"/"next" feeds can be empty (the call still resolves).
#
# Read-only basketball data — no betting, consistent with the no-money invariant.

provider:
  id: nbl
  display_name: "NBL (nbl.com.au)"
  doc_url: "https://github.com/DanielTomaro13/sportsdata-mcp/blob/main/documentation/NBL.md"
  base_urls:
    default: https://prod.rosetta.nbl.com.au
  default_headers:
    accept: "application/json"
    accept-language: "en-AU,en;q=0.9"
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    # The referer-gate: the proxy 403s ("MISSING_API_KEY") without an nbl.com.au
    # Origin + Referer. The Sec-Fetch-* trio matches a real browser CORS request
    # (mirrors the production scraper) so the gate can't tighten us out.
    origin: "https://nbl.com.au"
    referer: "https://nbl.com.au/"
    sec-fetch-dest: "empty"
    sec-fetch-mode: "cors"
    sec-fetch-site: "same-site"
  auth:
    default:
      type: none
  defaults:
    rate_limit_rps: 4
    request_timeout_seconds: 30
    retry_statuses: [429, 500, 502, 503, 504]
    max_retries: 3
    retry_backoff_seconds: 0.6

endpoints:
  # ─── discovery: seasons ───────────────────────────────────────────────
  - name: nbl_seasons
    group: nbl.basketball
    capabilities: [ref.seasons]
    summary: "Every NBL season (~73: NBL27, NBL26, blitz/preseason/tournament variants…), each with id (UUID), name, year (season start year), season_type, the Genius external_id, and start/end dates. The discovery entry point — take a season's `id` for nbl_stat_leaders, or its `year` for the year-scoped feeds. Current regular season is the latest `year` with season_type=regular."
    base: default
    path: /get/nbl/seasons
    auth: default
    response_hint: "{type, count, source, data:[{id, name, year, season_type, external_id, start_date, end_date, competition}]}"

  - name: nbl_season_current
    group: nbl.basketball
    capabilities: [ref.seasons]
    summary: "The current season(s). Convenience shortcut over nbl_seasons; may return empty in the deep off-season (the call still resolves). Use `limit` to cap rows."
    base: default
    path: /get/nbl/seasons/current
    auth: default
    params:
      - { name: limit, in: query, type: integer, default: 1, description: "Max rows (default 1)." }
    response_hint: "{type, count, data:[{id, name, year, season_type, external_id, start_date, end_date}]}"

  # ─── reference: clubs ─────────────────────────────────────────────────
  - name: nbl_teams
    group: nbl.basketball
    capabilities: [ref.teams]
    summary: "The NBL club catalogue (~78 incl. historical/relocated franchises) — each with id (UUID), name, team_code, team_nickname, logos and brand colours. Join team_id from nbl_players / nbl_schedule back to here."
    base: default
    path: /get/nbl/teams
    auth: default
    response_hint: "{type, count, data:[{id, external_id, name, team_code, team_nickname, team_logo, color_primary, color_secondary}]}"

  # ─── ladder / standings ───────────────────────────────────────────────
  - name: nbl_ladder
    group: nbl.basketball
    capabilities: [stats.ladder]
    summary: "The NBL ladder (standings) for one season — 10 clubs with position, played/won/lost, points_percentage, win_percentage, points_for/against, last_5 and current streak. `year` is the season start year (2025 = current NBL26)."
    base: default
    path: /get/nbl/standings/{year}/{seasonType}
    auth: default
    params:
      - &year_param { name: year, in: path, type: integer, required: true, description: "Season START year — 2025 = NBL26 (current 2025-26 season), 2026 = NBL27." }
      - &stype_param { name: seasonType, in: path, type: string, required: true, default: "regular", enum: [regular, all, in_season, preseason, finals], description: "Season phase: regular (the main season ladder), all, in_season, preseason or finals." }
    response_hint: "{type, count, data:[{id, position, played, won, lost, points_percentage, win_percentage, points_for, points_against, last_5, streak, team}]}"
    examples:
      - description: "Current-season ladder"
        params: { year: 2025, seasonType: regular }

  # ─── schedule / matches ───────────────────────────────────────────────
  - name: nbl_schedule
    group: nbl.basketball
    capabilities: [sport.fixtures_by_date, sport.match_score]
    summary: "Every match for one season: start_time, round, status, home/away scores, attendance, venue, match_slug/title, and home_team/away_team (id, name, team_code, logo, colour). `id` is the match id for nbl_match_boxscore and nbl_match_playbyplay. Rows are NOT in date order, so sort by start_time. `seasonType=all` for the whole season."
    base: default
    path: /get/nbl/matches/in/season/{year}/{seasonType}
    auth: default
    params:
      - *year_param
      - { name: seasonType, in: path, type: string, required: true, default: "all", enum: [all, regular, in_season, preseason, finals], description: "Phase to list (default all). The NBL Blitz pre-season tournament is filed under in_season." }
      # The feed pages at 100 rows by default and a season is ~200 (165 regular-season
      # games plus pre-season, Blitz and finals). Without an explicit limit this tool
      # returned an arbitrary 100 of them, and since rows are not in date order, that
      # was the back half of the season: every game played so far was missing and the
      # response looked complete. Measured 2026-09-29: default 100 rows, limit=1000 209.
      - { name: limit, in: query, type: integer, default: 400, description: "Rows to return. 400 covers a whole season in one call; the feed's own default is 100, which silently drops the rest." }
      - { name: offset, in: query, type: integer, description: "Rows to skip, for paging past `limit`." }
    # A full season is ~870 KB as sent, mostly broadcaster logos and match artwork.
    # Keep what the tool documents; drop the imagery.
    response_fields: [id, external_id, start_time, round, match_type, status, match_status, home_score, away_score, attendance, match_slug, match_title, play_by_play, venue.name, home_team.id, home_team.name, home_team.team_code, home_team.team_logo, home_team.color_primary, away_team.id, away_team.name, away_team.team_code, away_team.team_logo, away_team.color_primary]
    response_hint: "{type, count, data:[{id, external_id, start_time, round, match_type, status:'SCHEDULED'|'CONFIRMED'|'DRAFT', match_status:'scheduled'|'complete'|'draft', home_score, away_score, attendance, match_slug, match_title, play_by_play, venue:{name}, home_team:{id, name, team_code, team_logo, color_primary}, away_team:{…}}]}  — a finished game is status CONFIRMED / match_status complete. `play_by_play` is an id string once a game has play-by-play and null before; it is not a flag. Scores are STRINGS ('86', not 86) and null until a game is played."
    examples:
      - description: "Full NBL27 schedule and results"
        params: { year: 2026, seasonType: all }

  # ─── One match: the feed NBL.com's own game centre reads ──────────────
  # /get/match/{id} returns EVERYTHING for one game in ~1.3 MB: header, player and team
  # box scores, and the full play-by-play (1,129 KB of that on its own). Two tools read
  # the same URL and project different parts, the way fpl does with bootstrap-static,
  # so asking for a box score never costs a model the play-by-play.
  - name: nbl_match_boxscore
    group: nbl.basketball
    capabilities: [sport.match_boxscore, stats.player_match, sport.match_score]
    summary: "One game's box score: final score, every player's line (minutes, points, rebounds, assists, shooting splits including four-pointers, +/-, efficiency) and team totals by quarter. Get the match id from nbl_schedule (data[].id)."
    base: default
    path: /get/match/{matchId}
    auth: default
    params:
      - { name: matchId, in: path, type: string, required: true, description: "Match UUID from nbl_schedule (data[].id)." }
    response_fields:
      [id, match_title, start_time, round, match_type, status, match_status, home_score, away_score, attendance, venue.name,
       home_team.id, home_team.name, home_team.team_code, away_team.id, away_team.name, away_team.team_code,
       boxscore_field_mapping,
       player_match_statistics.player.full_name, player_match_statistics.player.jersey_number, player_match_statistics.player.playing_position,
       player_match_statistics.team.team_code, player_match_statistics.period, player_match_statistics.starter, player_match_statistics.participated,
       player_match_statistics.minutes, player_match_statistics.points, player_match_statistics.rebounds, player_match_statistics.offensive_rebounds,
       player_match_statistics.defensive_rebounds, player_match_statistics.assists, player_match_statistics.steals, player_match_statistics.blocks,
       player_match_statistics.turnovers, player_match_statistics.personal_fouls, player_match_statistics.technical_fouls,
       player_match_statistics.field_goals_made, player_match_statistics.field_goals_attempted, player_match_statistics.field_goals_percentage,
       player_match_statistics.two_points_made, player_match_statistics.two_points_attempted,
       player_match_statistics.three_points_made, player_match_statistics.three_points_attempted, player_match_statistics.three_points_percentage,
       player_match_statistics.four_points_made, player_match_statistics.four_points_attempted,
       player_match_statistics.free_throws_made, player_match_statistics.free_throws_attempted, player_match_statistics.free_throws_percentage,
       player_match_statistics.plus_minus, player_match_statistics.efficiency,
       team_match_statistics.team.team_code, team_match_statistics.period, team_match_statistics.points, team_match_statistics.rebounds,
       team_match_statistics.offensive_rebounds, team_match_statistics.defensive_rebounds, team_match_statistics.assists,
       team_match_statistics.steals, team_match_statistics.blocks, team_match_statistics.turnovers, team_match_statistics.fouls,
       team_match_statistics.field_goals_made, team_match_statistics.field_goals_attempted,
       team_match_statistics.three_points_made, team_match_statistics.three_points_attempted,
       team_match_statistics.four_points_made, team_match_statistics.four_points_attempted,
       team_match_statistics.free_throws_made, team_match_statistics.free_throws_attempted, team_match_statistics.timeouts]
    response_hint: "{type, count, data:[{id, match_title, start_time, status, home_score, away_score, venue:{name}, home_team:{id, name, team_code}, away_team:{…}, boxscore_field_mapping:{points:'PTS', …}, player_match_statistics:[{player:{full_name, jersey_number, playing_position}, team:{team_code}, period:'0', starter, participated, minutes:'24:30', points, rebounds, assists, …}], team_match_statistics:[{team:{team_code}, period:'0'|'1'…'4', points, rebounds, …}]}]}  — `data` is a one-element list. TEAM rows are per quarter: period '0' is the full game and '1'-'4' the quarters, so filter on period before summing or you count every point twice. Player rows are full-game (period '0'). The NBL has four-point shots, hence the four_points_* columns. Check `participated` to skip players who did not play. TYPES: the header's home_score/away_score are STRINGS ('86'), while every stat is a number, and percentages are fractions (0.4 = 40%), so convert before comparing a stat to the score."
    examples:
      - description: "Tasmania JackJumpers v NZ Breakers, NBL Blitz, 6 Sep 2026"
        params: { matchId: "3d09795f-58a7-11f1-aed3-b7a799a5060e" }

  - name: nbl_match_playbyplay
    group: nbl.basketball
    capabilities: [stats.play_by_play]
    summary: "One game's full play-by-play: every event with period, game clock, shot clock, type, the player, success on shots, shot coordinates and the running score. Large: ~1,000 events for a game. Get the match id from nbl_schedule (data[].id)."
    base: default
    path: /get/match/{matchId}
    auth: default
    params:
      - { name: matchId, in: path, type: string, required: true, description: "Match UUID from nbl_schedule (data[].id)." }
    response_fields:
      [id, match_title, status, home_score, away_score, home_team.name, home_team.team_code, away_team.name, away_team.team_code,
       play_by_play.action_id, play_by_play.period, play_by_play.period_type, play_by_play.clock, play_by_play.shot_clock,
       play_by_play.action_type, play_by_play.readable_action_type, play_by_play.success, play_by_play.score_1, play_by_play.score_2,
       play_by_play.coordinates, play_by_play.team.team_code, play_by_play.player.full_name, play_by_play.player.jersey_number, play_by_play.timestamp]
    response_hint: "{type, count, data:[{id, match_title, status, home_score, away_score, home_team:{name, team_code}, away_team:{…}, play_by_play:[{action_id, period, period_type, clock:'02:12', shot_clock, action_type:'2pt'|'3pt'|'freeThrow'|'rebound'|'foul'|'substitution'|'possession'|…, readable_action_type:'2-Point Shot - Driving Layup', success, score_1, score_2, coordinates:{x, y}, team:{team_code}, player:{full_name, jersey_number}, timestamp}]}]}  — score_1 is the HOME score and score_2 the away score. `success` is set on shots only. `player` is absent on team events (possession, period markers). Free throws are `freeThrow`, camel-cased. About 40% of events are possession and clock bookkeeping, not plays. score_1/score_2 are integers, but the header home_score/away_score are STRINGS."
    examples:
      - description: "Tasmania JackJumpers v NZ Breakers, NBL Blitz, 6 Sep 2026"
        params: { matchId: "3d09795f-58a7-11f1-aed3-b7a799a5060e" }

  - name: nbl_match_outcomes
    group: nbl.basketball
    capabilities: [sport.match_score, stats.head_to_head]
    summary: "Per-team match outcomes (results) for a season — win/loss rows by team, for head-to-head and form analysis."
    base: default
    path: /get/match/outcomes/for/nbl/teams/in/season/{year}/{seasonType}
    auth: default
    params:
      - *year_param
      - { name: seasonType, in: path, type: string, required: true, default: "regular", enum: [regular, all, in_season, preseason, finals], description: "Season phase (default regular)." }
    response_hint: "{type, count, data:[{team, …per-match outcome rows}]}"

  - name: nbl_next_matches
    group: nbl.basketball
    capabilities: [sport.fixtures_by_date]
    summary: "Upcoming matches across all NBL teams for a season (empty in the deep off-season). For the full fixture incl. completed games use nbl_schedule."
    base: default
    path: /get/next/matches/for/teams/in/nbl/{year}
    auth: default
    params:
      - *year_param
    response_hint: "{type, count, data:[{id, start_time, round, home_team, away_team}]}"

  # ─── players / rosters ────────────────────────────────────────────────
  - name: nbl_players
    group: nbl.basketball
    capabilities: [ref.players]
    summary: "All players for one season (~165) — each with jersey_number, playing_position and embedded player {id, first_name, last_name, …}, team and season objects. The player `id` (UUID) feeds nbl_player_stats / nbl_player_boxscores."
    base: default
    path: /get/nbl/players/in/season/{year}
    auth: default
    params:
      - *year_param
    response_hint: "{type, count, data:[{jersey_number, playing_position, player:{id, first_name, last_name}, team:{id, name, team_code}, season}]}"
    examples:
      - description: "All NBL26 players"
        params: { year: 2025 }

  - name: nbl_team_roster
    group: nbl.basketball
    capabilities: [ref.players]
    summary: "One team's roster for a season. teamId comes from the team objects in nbl_players / nbl_schedule / nbl_ladder."
    base: default
    path: /get/nbl/players/for/team/{teamId}/in/season/{year}
    auth: default
    params:
      - { name: teamId, in: path, type: string, required: true, description: "Team id (UUID) — from a team object in nbl_players / nbl_schedule." }
      - *year_param
    response_hint: "{type, count, data:[{jersey_number, playing_position, player:{id, first_name, last_name}, team}]}"

  # ─── statistics ───────────────────────────────────────────────────────
  - name: nbl_player_stats
    group: nbl.basketball
    capabilities: [stats.player_season, stats.player_profile]
    summary: "Season statistics for one player — points/rebounds/assists/blocks/steals/turnovers and their per-game averages, shooting splits (field goals / three-pointers / free throws made-attempted-percentage), fouls, minutes. playerId is the player UUID from nbl_players."
    base: default
    path: /get/nbl/statistics/for/player/{playerId}
    auth: default
    params:
      - { name: playerId, in: path, type: string, required: true, description: "Player id (UUID) — from nbl_players[].player.id." }
    response_hint: "{type, count, data:[{points_average, rebounds_total_average, assists_average, blocks_average, steals_average, turnovers_average, field_goals_percentage, three_pointers_percentage, free_throws_percentage, fouls_average, minutes}]}"

  - name: nbl_player_boxscores
    group: nbl.basketball
    capabilities: [stats.player_game_log]
    summary: "Game-by-game box scores for one player across a season — per match the points/rebounds/assists/blocks/steals/turnovers and playing position. The score-series / game-log source."
    base: default
    path: /get/nbl/player_boxscores/for/{playerId}/in/season/{year}/{seasonType}
    auth: default
    params:
      - { name: playerId, in: path, type: string, required: true, description: "Player id (UUID) — from nbl_players[].player.id." }
      - *year_param
      - { name: seasonType, in: path, type: string, required: true, default: "regular", enum: [regular, all, in_season, preseason, finals], description: "Season phase (default regular)." }
    response_hint: "{type, count, data:[{period, playing_position, points, rebounds, assists, blocks, steals, turnovers}]}"

  - name: nbl_team_stats
    group: nbl.basketball
    capabilities: [stats.team_season]
    summary: "Team statistics for a season — totals and per-game averages across assists, rebounds (offensive/defensive), blocks, steals, turnovers, and shooting (field goals / three-pointers / free throws made-attempted-percentage)."
    base: default
    path: /get/nbl/team/stats/for/season/{year}/{seasonType}
    auth: default
    params:
      - *year_param
      - { name: seasonType, in: path, type: string, required: true, default: "regular", enum: [regular, all, in_season, preseason, finals], description: "Season phase (default regular)." }
    response_hint: "{type, count, data:[{team, assists, assists_average, defensive_rebounds, blocks, steals, turnovers, field_goals_made, field_goals_attempted, field_goals_percentage, three_pointers_percentage}]}"
    examples:
      - description: "Team stats, current season"
        params: { year: 2025, seasonType: regular }

  - name: nbl_stat_leaders
    group: nbl.basketball
    capabilities: [stats.leaders_season]
    summary: "Season statistical leaders (points/rebounds/assists/etc. averages, per player) for one season — pass the season UUID (`seasonId`) from nbl_seasons (data[].id), NOT the year. Use `limit` to cap rows (limit=-1 for all)."
    base: default
    path: /get/nbl/stats/leaders/for/season/id/{seasonId}
    auth: default
    params:
      - { name: seasonId, in: path, type: string, required: true, description: "Season UUID — from nbl_seasons (data[].id, the season_type=regular one for the main leaders)." }
      - { name: limit, in: query, type: integer, default: 50, description: "Max rows; -1 for all." }
      - { name: sort, in: query, type: string, description: "Sort key, prefix `-` for descending — e.g. -points_average (top scorers), -assists_average, -rebounds_total_average. Any per-game average column works." }
    response_hint: "{type, count, data:[{player, team, points_average, rebounds_total_average, assists_average, field_goals_percentage, three_pointers_made_average, …}]}"
    examples:
      - description: "Top 50 scorers for NBL26"
        params: { seasonId: "1f8e4a79-e98b-457b-85a5-e4b898c6c0bd", limit: 50, sort: "-points_average" }

  # ─── content: news ────────────────────────────────────────────────────
  - name: nbl_news
    group: nbl.basketball
    capabilities: [content.news]
    summary: "NBL news articles (latest ~200) — each with title, slug, body (HTML), excerpt, sub_headline, byline, published_date, categories/tags, a related_player and match_slug link, and featured_image_url. NOTE: this feed returns a RAW ARRAY (not the {type,count,data} envelope). Use `limit` to cap rows."
    base: default
    path: /get/nbl/news
    auth: default
    params:
      - { name: limit, in: query, type: integer, description: "Max articles to return (default: all ~200)." }
    response_hint: "array of {id, status, title, slug, body, excerpt, sub_headline, byline, published_date, categories, tags, related_player, match_slug, featured_image_url, likes}  (RAW ARRAY, not enveloped)"
    examples:
      - description: "Latest 10 NBL articles"
        params: { limit: 10 }
