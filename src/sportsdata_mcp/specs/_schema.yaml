# Self-documenting reference for the spec format. NOT loaded at runtime — it
# mirrors the pydantic models in `spec.py` so contributors can see the contract
# without reading Python. `sportsdata-mcp lint` validates real specs against the
# pydantic models, which are the actual source of truth.

# ─── Top-level keys ──────────────────────────────────────────────────────
# spec_version:        int   (default 1; loader warns, not fails, on a higher number)
# provider:            object (required)        — see below
# endpoints:           list   (optional)        — one tool each
# dispatchers:         list   (optional)        — one tool serving many operations
# graphql:             object (optional)        — persisted-query operation table
# reference_resources: list   (optional)        — static lookup tables as MCP resources

provider:
  id: "lowercase slug, ^[a-z][a-z0-9_]*$ (required)"
  display_name: "human name (required)"
  doc_url: "link to documentation/*.md (optional)"
  base_urls:
    # one or more named base URLs; endpoints reference these by key via `base:`
    default: "https://api.example.com"
  default_headers:
    # sent on every request to this provider (optional)
    User-Agent: "..."
  auth:
    # one block per base that needs auth; endpoints reference by key via `auth:`
    default:
      type: "none | static_header | static_query | afl_wmctok"
      # static_header:  header, (value | env)   — secret rides in a request header
      # static_query:   param,  (value | env)   — secret rides in a query param (e.g. Data Golf ?key=)
      # afl_wmctok:     mint_url, mint_headers, header
  hash_refresh:
    # optional — used by `sportsdata-mcp refresh-hashes`
    bundle_host: "https://www.example.com"
    bundle_url_pattern: "/assets/vendor-graphql-ops-*.js"

endpoints:
  - name: "tool name, ^[a-z][a-z0-9_]*$ (required, unique across all specs)"
    group: "{provider}.{surface}.{category} (required)"
    capabilities: ["must exist in _capabilities.yaml"]
    summary: "one-line description shown to the model (required)"
    method: "GET | POST | PUT | DELETE | PATCH (default GET)"
    base: "key into provider.base_urls (default 'default')"
    path: "/v2/things/{id}  — {placeholders} must be declared as path params"
    auth: "key into provider.auth (default 'default')"
    params:
      # in:   path | query | header | body | dispatch
      # type: string | integer | number | boolean | string_csv | json | object
      - { name: id, in: path, type: string, required: true, description: "..." }
      - { name: pageSize, in: query, type: integer, default: 50, description: "..." }
    response_hint: "terse shape hint, e.g. {meta, items:[...]}"
    examples:
      - description: "..."
        params: {pageSize: 50}

dispatchers:
  # kind: graphql_persisted — one tool over an Apollo persisted-query gateway
  - name: "..._graphql_call"
    group: "{provider}.graphql"
    kind: graphql_persisted
    summary: "..."
    endpoint: "https://api.example.com/gql/router (full URL)"
    method: "GET | POST"
    auth: "none"
    default_headers: {Content-Type: application/json}
    catalog_resource: "example://graphql/operations"
    params:
      - { name: operation, in: dispatch, type: string, required: true }
      - { name: variables, in: dispatch, type: object, required: false }
  # kind: graphql_query — one tool over a full-query GraphQL API (POSTs the literal
  #                        query text from the graphql block, not a persisted hash)
  - name: "..._call"
    group: "{provider}.racing"
    kind: graphql_query
    summary: "..."
    base: "racing_graphql"
    endpoint: "/cosmo/v1/graphql (path under base)"
    method: POST
    catalog_resource: "example://racing/operations"
    params:
      - { name: operation, in: dispatch, type: string, required: true }
      - { name: variables, in: dispatch, type: object, required: false }
  # kind: templated_rest — one tool over a family of parametric REST paths
  - name: "..._call"
    group: "{provider}.premium.family"
    kind: templated_rest
    summary: "..."
    base: "premium"
    auth: "premium"
    method: GET
    catalog_resource: "example://family/operations"
    params:
      - { name: operation, in: dispatch, type: string, required: true }
      - { name: path_params, in: dispatch, type: object, required: true }
      - { name: query_params, in: dispatch, type: object, required: false }
    operations:
      - name: thing_by_id
        path: /family/thing/{thingId}
        path_params: [thingId]
        query_params: [limit]

graphql:
  # Shared by both GraphQL dispatcher kinds. Persisted ops carry `sha256`;
  # full-query (graphql_query) ops carry `query` (+ optional default_variables).
  operations:
    - name: "OperationName"
      sha256: "64-hex persisted-query hash (graphql_persisted only)"
      query: "literal query text, incl. fragments (graphql_query only)"
      variables: "human-readable signature, e.g. id:ID!, isLoggedIn:Boolean!"
      default_variables: {brand: "FDR", product: "TVG5"}  # merged under caller vars (graphql_query)
      verified: false

reference_resources:
  - uri: "example://teams/idmap"
    summary: "Team id ↔ name map"
    base: default
    path: /v2/teams/idmap
    auth: default
    mime_type: application/json
