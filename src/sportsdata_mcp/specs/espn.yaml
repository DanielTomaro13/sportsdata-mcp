  # ─── espn.cdn — the CDN live core feed (cdn.espn.com, needs ?xhr=1) ────
  - name: espn_cdn_call
    group: espn.cdn
    kind: templated_rest
    base: cdn
    auth: default
    capabilities:
      - sport.fixtures_by_date
      - sport.match_score
      - sport.match_detail
      - sport.match_boxscore
      - stats.play_by_play
    summary: |
      Gateway to the ESPN CDN core live feed (cdn.espn.com). Fast, lightly-cached
      scoreboard/game/boxscore/playbyplay JSON. The path slug is the LEAGUE, not the
      sport (`nfl`, `nba`, `mlb`, `college-football`, `mens-college-basketball`) — for
      soccer use the competition slug directly (`eng.1`, `esp.1`, `uefa.champions`).
      The CDN covers ESPN's front-page leagues only (no `nhl`). gameId comes from the
      scoreboard op. Every request carries ?xhr=1 (added by default). Browse
      espn://cdn/operations.
    catalog_resource: "espn://cdn/operations"
    params:
      - { name: operation, in: dispatch, type: string, required: true, description: "CDN operation: scoreboard, game, boxscore or playbyplay." }
      - { name: path_params, in: dispatch, type: object, required: false, description: "League path slug, e.g. {league: 'nfl'} or {league: 'eng.1'} for soccer." }
      - { name: query_params, in: dispatch, type: object, required: false, description: "Query overrides, e.g. {gameId: '401547439'} or {dates: '20251101'}." }
    operations:
      - name: scoreboard
        path: /core/{league}/scoreboard
        path_params: [league]
        query_params: [dates, xhr]
        query_defaults: {xhr: '1'}
        summary: "CDN scoreboard for a league slug (e.g. league=nfl); events + ids."
      - name: game
        path: /core/{league}/game
        path_params: [league]
        query_params: [gameId, xhr]
        query_defaults: {xhr: '1'}
        summary: "CDN single-game feed (gameId from scoreboard)."
      - name: boxscore
        path: /core/{league}/boxscore
        path_params: [league]
        query_params: [gameId, xhr]
        query_defaults: {xhr: '1'}
        summary: "CDN box score for one game (gameId from scoreboard)."
      - name: playbyplay
        path: /core/{league}/playbyplay
        path_params: [league]
        query_params: [gameId, xhr]
        query_defaults: {xhr: '1'}
        summary: "CDN play-by-play for one game (gameId from scoreboard)."
