spec_version: 1

# MLB — the official MLB Stats API (statsapi.mlb.com), the same public, no-auth
# JSON API that the MLB-StatsAPI Python library wraps. We read it directly. Most
# endpoints live under /api/v1; the full game "feed/live" lives under /api/v1.1.
#
# Id model: sportId=1 is MLB. Discover ids with mlb_teams (teamId), mlb_schedule
# (gamePk), mlb_team_roster / mlb_player_search (personId), mlb_venues (venueId).
# Then drill into a game (boxscore / linescore / playByPlay / live feed) or a
# player (mlb_player, mlb_player_stats).
#
# `hydrate` is the API's power feature: many endpoints accept a comma-separated
# hydrate string (e.g. hydrate=team,stats,roster(person)) to embed related objects
# in one call. It is exposed where most useful and documented per tool.

provider:
  id: mlb
  display_name: "MLB (statsapi.mlb.com)"
  doc_url: "https://github.com/DanielTomaro13/sportsdata-mcp/blob/main/documentation/MLB.md"
  base_urls:
    default: https://statsapi.mlb.com/api/v1
    live: https://statsapi.mlb.com/api/v1.1
  default_headers:
    User-Agent: "Mozilla/5.0 (compatible; sportsdata-mcp/0.1)"
    Accept: "application/json"
  auth:
    default:
      type: none
  defaults:
    rate_limit_rps: 5
    request_timeout_seconds: 30
    retry_statuses: [429, 500, 502, 503, 504]
    max_retries: 2
    retry_backoff_seconds: 0.5

endpoints:
  # ─── mlb.reference — catalogues (sports, leagues, teams, players, venues) ─
  - name: mlb_sports
    group: mlb.reference
    capabilities: [sport.competitions_list]
    summary: "Sport catalogue — the sportId lookup (1 = Major League Baseball; others are MiLB levels, college, international)."
    base: default
    path: /sports
    auth: default
    params:
      - { name: sportId, in: query, type: integer, description: "Filter to one sport." }
    response_hint: "{sports:[{id, code, name, abbreviation, sortOrder, activeStatus}]}"

  - name: mlb_leagues
    group: mlb.reference
    capabilities: [sport.competitions_list]
    summary: "League catalogue — e.g. American League (103) and National League (104). Pass sportId=1 for MLB."
    base: default
    path: /league
    auth: default
    params:
      - { name: sportId, in: query, type: integer, default: 1, description: "Sport id (1 = MLB)." }
      - { name: leagueIds, in: query, type: string_csv, description: "Filter to specific league ids (e.g. 103, 104)." }
      - { name: seasons, in: query, type: string_csv, description: "Season year(s)." }
    response_hint: "{leagues:[{id, name, abbreviation, sport, seasonState, hasWildCard}]}"

  - name: mlb_divisions
    group: mlb.reference
    capabilities: [sport.competitions_list]
    summary: "Division catalogue (AL/NL East, Central, West) with their league + sport links."
    base: default
    path: /divisions
    auth: default
    params:
      - { name: divisionId, in: query, type: integer, description: "Filter to one division." }
      - { name: leagueId, in: query, type: integer, description: "Filter by league." }
      - { name: sportId, in: query, type: integer, description: "Filter by sport." }
    response_hint: "{divisions:[{id, name, nameShort, abbreviation, league, sport}]}"

  - name: mlb_teams
    group: mlb.reference
    capabilities: [ref.teams]
    summary: "Team catalogue — id, name, abbreviation, location, league/division, home venue. Pass sportId=1 for the 30 MLB clubs."
    base: default
    path: /teams
    auth: default
    params:
      - { name: sportId, in: query, type: integer, default: 1, description: "Sport id (1 = MLB)." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: leagueIds, in: query, type: string_csv, description: "Filter by league id(s)." }
      - { name: hydrate, in: query, type: string, description: "Embed related objects (e.g. 'venue,league,division')." }
    response_hint: "{teams:[{id, name, abbreviation, teamName, locationName, league, division, venue, firstYearOfPlay}]}"

  - name: mlb_team_roster
    group: mlb.reference
    capabilities: [ref.players]
    summary: "A team's roster — players with position and jersey number. rosterType selects active / 40-man / full-season / depth chart."
    base: default
    path: /teams/{teamId}/roster
    auth: default
    params:
      - { name: teamId, in: path, type: integer, required: true, description: "Team id (from mlb_teams)." }
      - { name: rosterType, in: query, type: string, default: active, description: "active | 40Man | fullSeason | fullRoster | depthChart | gameday." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: date, in: query, type: string, description: "Roster as of a date (YYYY-MM-DD)." }
      - { name: hydrate, in: query, type: string, description: "Embed related objects (e.g. 'person(stats(type=season))')." }
    response_hint: "{roster:[{person:{id, fullName}, jerseyNumber, position:{abbreviation, name}, status}], teamId, rosterType}"

  - name: mlb_player
    group: mlb.reference
    capabilities: [ref.players, stats.player_profile]
    summary: "Player biographical profile — name, DOB, bats/throws, height/weight, position, debut, current team. One personId."
    base: default
    path: /people/{personId}
    auth: default
    params:
      - { name: personId, in: path, type: integer, required: true, description: "Player id (from a roster, schedule, boxscore or mlb_player_search)." }
      - { name: hydrate, in: query, type: string, description: "Embed related objects (e.g. 'currentTeam,stats(type=season)')." }
    response_hint: "{people:[{id, fullName, primaryNumber, birthDate, currentAge, height, weight, primaryPosition, batSide, pitchHand, mlbDebutDate, currentTeam}]}"

  - name: mlb_player_search
    group: mlb.reference
    capabilities: [ref.players]
    summary: "Find players by name — resolves a name to personId(s) and basic bio."
    base: default
    path: /people/search
    auth: default
    params:
      - { name: names, in: query, type: string, required: true, description: "Name to search (e.g. 'Aaron Judge')." }
      - { name: limit, in: query, type: integer, description: "Max results." }
    response_hint: "{people:[{id, fullName, firstName, lastName, birthDate, primaryPosition}]}"

  - name: mlb_venues
    group: mlb.reference
    capabilities: [ref.venues]
    summary: "Venue detail for one or more venueIds — name, location, field/roof info."
    base: default
    path: /venues
    auth: default
    params:
      - { name: venueIds, in: query, type: string_csv, required: true, description: "Venue id(s) (from a team's venue or a game)." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: hydrate, in: query, type: string, description: "Embed related objects (e.g. 'location,fieldInfo')." }
    response_hint: "{venues:[{id, name, location, fieldInfo, timeZone, active}]}"

  - name: mlb_seasons
    group: mlb.reference
    capabilities: [ref.seasons]
    summary: "Season catalogue with key dates (regular-season start/end, postseason, etc.). Pass sportId=1."
    base: default
    path: /seasons
    auth: default
    params:
      - { name: sportId, in: query, type: integer, default: 1, description: "Sport id (1 = MLB)." }
      - { name: season, in: query, type: integer, description: "Filter to one season year." }
    response_hint: "{seasons:[{seasonId, regularSeasonStartDate, regularSeasonEndDate, seasonStartDate, seasonEndDate, preSeasonStartDate, postSeasonEndDate}]}"

  - name: mlb_seasons_all
    group: mlb.reference
    capabilities: [ref.seasons]
    summary: "Every season in MLB history (151+) with key dates — the /seasons/all catalogue. (Plain /seasons only returns the current season; an ?all=true query there is a no-op.)"
    base: default
    path: /seasons/all
    auth: default
    params:
      - { name: sportId, in: query, type: integer, default: 1, description: "Sport id (1 = MLB)." }
      - { name: divisionId, in: query, type: integer, description: "Filter by division." }
      - { name: leagueId, in: query, type: integer, description: "Filter by league (103=AL, 104=NL)." }
    response_hint: "{seasons:[{seasonId, regularSeasonStartDate, regularSeasonEndDate, seasonStartDate, seasonEndDate, preSeasonStartDate, qualifierPlateAppearances, hasWildcard}]}"

  # ─── mlb.schedule — games by date / team ──────────────────────────────
  - name: mlb_schedule
    group: mlb.schedule
    capabilities: [sport.fixtures_by_date]
    summary: "Game schedule — by single date or startDate/endDate range, optionally for one team. Each game carries gamePk, status, teams and score."
    base: default
    path: /schedule
    auth: default
    params:
      - { name: sportId, in: query, type: integer, default: 1, description: "Sport id (1 = MLB)." }
      - { name: date, in: query, type: string, description: "Single date (YYYY-MM-DD)." }
      - { name: startDate, in: query, type: string, description: "Range start (YYYY-MM-DD); use with endDate." }
      - { name: endDate, in: query, type: string, description: "Range end (YYYY-MM-DD)." }
      - { name: teamId, in: query, type: integer, description: "Filter to one team." }
      - { name: gameTypes, in: query, type: string_csv, description: "Game type code(s): R (regular), F/D/L/W (postseason), S (spring), etc." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: hydrate, in: query, type: string, description: "Embed related objects (e.g. 'team,linescore,probablePitcher,decisions')." }
    response_hint: "{totalGames, dates:[{date, games:[{gamePk, gameDate, status, teams:{away:{team,score}, home:{team,score}}, venue}]}]}"

  # ─── mlb.game — single-game detail ────────────────────────────────────
  - name: mlb_boxscore
    group: mlb.game
    capabilities: [sport.match_boxscore, stats.player_match]
    summary: "Full game boxscore — both teams' batting + pitching lines per player, team totals, officials and top performers."
    base: default
    path: /game/{gamePk}/boxscore
    auth: default
    params:
      - { name: gamePk, in: path, type: integer, required: true, description: "Game id (from mlb_schedule)." }
      - { name: timecode, in: query, type: string, description: "Point-in-time snapshot (YYYYMMDD_HHMMSS)." }
    response_hint: "{teams:{away:{team, teamStats, players:{ID#:{stats:{batting,pitching}, position}}}, home:{...}}, officials, topPerformers}"

  - name: mlb_linescore
    group: mlb.game
    capabilities: [sport.match_score]
    summary: "Game linescore — runs per inning, R/H/E totals, current inning + state, and on-base/defense for live games."
    base: default
    path: /game/{gamePk}/linescore
    auth: default
    params:
      - { name: gamePk, in: path, type: integer, required: true, description: "Game id." }
      - { name: timecode, in: query, type: string, description: "Point-in-time snapshot (YYYYMMDD_HHMMSS)." }
    response_hint: "{currentInning, inningState, isTopInning, innings:[{num, home:{runs,hits,errors}, away:{...}}], teams:{home:{runs,hits,errors}, away:{...}}}"

  - name: mlb_playbyplay
    group: mlb.game
    capabilities: [stats.play_by_play]
    summary: "Pitch-by-pitch / play-by-play log — every plate appearance with result, pitches, counts, runners and scoring-play flags."
    base: default
    path: /game/{gamePk}/playByPlay
    auth: default
    params:
      - { name: gamePk, in: path, type: integer, required: true, description: "Game id." }
      - { name: timecode, in: query, type: string, description: "Point-in-time snapshot (YYYYMMDD_HHMMSS)." }
    response_hint: "{allPlays:[{result, about:{inning,halfInning,isScoringPlay}, matchup:{batter,pitcher}, playEvents:[...], count}], scoringPlays, currentPlay}"

  - name: mlb_live_feed
    group: mlb.game
    capabilities: [sport.match_detail]
    summary: "The complete live game feed (v1.1) — gameData (teams, players, venue, weather, probables) + liveData (boxscore, linescore, full plays). The firehose; large."
    base: live
    path: /game/{gamePk}/feed/live
    auth: default
    params:
      - { name: gamePk, in: path, type: integer, required: true, description: "Game id." }
      - { name: timecode, in: query, type: string, description: "Point-in-time snapshot (YYYYMMDD_HHMMSS); omit for latest." }
      - { name: hydrate, in: query, type: string, description: "Additional hydrations." }
    response_hint: "{gamePk, gameData:{teams, players, venue, weather, probablePitchers}, liveData:{plays, linescore, boxscore, decisions}}"

  # ─── mlb.stats — standings, leaders, player/team stats ─────────────────
  - name: mlb_standings
    group: mlb.stats
    capabilities: [stats.ladder]
    summary: "Division standings — per-team W/L, pct, GB, streak, run differential, wild-card and division ranks. Pass leagueId (103=AL, 104=NL)."
    base: default
    path: /standings
    auth: default
    params:
      - { name: leagueId, in: query, type: string, default: "103,104", description: "League id(s): 103=AL, 104=NL (comma-separated)." }
      - { name: season, in: query, type: integer, description: "Season year (defaults to current)." }
      - { name: standingsTypes, in: query, type: string, default: regularSeason, description: "regularSeason | wildCard | divisionLeaders | springTraining | etc." }
      - { name: date, in: query, type: string, description: "Standings as of a date (YYYY-MM-DD)." }
      - { name: hydrate, in: query, type: string, description: "Embed related objects (e.g. 'team')." }
    response_hint: "{records:[{division, league, teamRecords:[{team, wins, losses, winningPercentage, gamesBack, streak, runDifferential, divisionRank, wildCardRank}]}]}"

  - name: mlb_stats
    group: mlb.stats
    capabilities: [stats.player_season]
    summary: "Season stats query across players — by group (hitting/pitching/fielding) and type (season, career, byDateRange, ...). Sort + limit for top-N tables."
    base: default
    path: /stats
    auth: default
    params:
      - { name: stats, in: query, type: string, default: season, description: "Stat type: season | career | yearByYear | byDateRange | statSplits | ..." }
      - { name: group, in: query, type: string, default: hitting, description: "Stat group: hitting | pitching | fielding." }
      - { name: sportId, in: query, type: integer, default: 1, description: "Sport id (1 = MLB)." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: playerPool, in: query, type: string, description: "all | qualified | rookies | etc." }
      - { name: teamId, in: query, type: integer, description: "Filter to one team." }
      - { name: limit, in: query, type: integer, description: "Max rows." }
      - { name: sortStat, in: query, type: string, description: "Stat to sort by (e.g. 'homeRuns')." }
    response_hint: "{stats:[{type, group, splits:[{season, player, team, stat:{...}}]}]}"

  - name: mlb_player_stats
    group: mlb.stats
    capabilities: [stats.player_season, stats.player_career, stats.player_game_log]
    summary: "One player's stats — by type (season / career / yearByYear / gameLog) and group (hitting/pitching/fielding)."
    base: default
    path: /people/{personId}/stats
    auth: default
    params:
      - { name: personId, in: path, type: integer, required: true, description: "Player id." }
      - { name: stats, in: query, type: string, default: season, description: "season | career | yearByYear | gameLog | statSplits." }
      - { name: group, in: query, type: string, default: hitting, description: "hitting | pitching | fielding." }
      - { name: season, in: query, type: integer, description: "Season year (for season/gameLog types)." }
    response_hint: "{stats:[{type, group, splits:[{season, stat:{...}, team, league}]}]}"

  - name: mlb_leaders
    group: mlb.stats
    capabilities: [stats.leaders_season]
    summary: "League leaders for one or more categories (homeRuns, battingAverage, era, strikeouts, wins, saves, ...)."
    base: default
    path: /stats/leaders
    auth: default
    params:
      - { name: leaderCategories, in: query, type: string_csv, required: true, description: "Category code(s): homeRuns, battingAverage, runsBattedIn, era, strikeouts, wins, saves, ..." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: sportId, in: query, type: integer, default: 1, description: "Sport id (1 = MLB)." }
      - { name: leagueId, in: query, type: string, description: "League id(s): 103=AL, 104=NL." }
      - { name: statGroup, in: query, type: string, description: "hitting | pitching | fielding (disambiguates a category)." }
      - { name: limit, in: query, type: integer, description: "Top-N to return." }
    response_hint: "{leagueLeaders:[{leaderCategory, statGroup, season, leaders:[{rank, value, person, team}]}]}"

  # ─── mlb.extra — draft, awards, attendance ────────────────────────────
  - name: mlb_draft
    group: mlb.extra
    capabilities: [sport.draft]
    summary: "MLB Rule 4 draft results for a year — picks with player, school/team, position and signing info. Filter by round."
    base: default
    path: /draft/{year}
    auth: default
    params:
      - { name: year, in: path, type: integer, required: true, description: "Draft year (e.g. 2024)." }
      - { name: round, in: query, type: string, description: "Filter to one round." }
      - { name: teamId, in: query, type: integer, description: "Filter to picks by one team." }
      - { name: limit, in: query, type: integer, description: "Max picks." }
    response_hint: "{drafts:{draftYear, rounds:[{round, picks:[{pickNumber, person, team, school, position}]}]}}"

  - name: mlb_awards_list
    group: mlb.extra
    # Deliberately untagged. A decoder for THIS provider's own ids and market keys.
    # Another provider's decoder answers a different question, so a shared tag would offer
    # false alternatives.
    capabilities: []
    summary: "Award definitions catalogue — every awardId with name, description and sport (the id lookup for mlb_awards)."
    base: default
    path: /awards
    auth: default
    params:
      - { name: sportId, in: query, type: integer, description: "Filter by sport (1 = MLB)." }
      - { name: leagueId, in: query, type: integer, description: "Filter by league (103=AL, 104=NL)." }
    response_hint: "{awards:[{id, name, description, sortOrder, sport, active}]}"

  - name: mlb_awards
    group: mlb.extra
    capabilities: [sport.awards]
    summary: "Recipients of an award — e.g. MLBHOF (Hall of Fame), ALMVP/NLMVP, ALCY/NLCY (Cy Young), ALROY/NLROY (Rookie of the Year). Discover awardIds with mlb_awards_list."
    base: default
    path: /awards/{awardId}/recipients
    auth: default
    params:
      - { name: awardId, in: path, type: string, required: true, description: "Award id (e.g. MLBHOF, ALMVP, NLMVP, ALCY, NLCY, ALROY, NLROY)." }
      - { name: sportId, in: query, type: integer, default: 1, description: "Sport id (1 = MLB)." }
      - { name: season, in: query, type: integer, description: "Filter to one season." }
    response_hint: "{awards:[{id, name, season, player, team, votes}]}"

  - name: mlb_attendance
    group: mlb.extra
    # Deliberately untagged. Provider-specific detail with no cross-provider counterpart
    # in the catalogue.
    capabilities: []
    summary: "Attendance figures for a team or league/season — per-game and aggregate home/away/total gate."
    base: default
    path: /attendance
    auth: default
    params:
      - { name: teamId, in: query, type: integer, description: "Team id — takes precedence over leagueId when both are set." }
      - { name: leagueId, in: query, type: string, default: "103,104", description: "League id(s): 103=AL, 104=NL. Defaulted so the tool works without a teamId." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: date, in: query, type: string, description: "As-of date (YYYY-MM-DD)." }
    response_hint: "{records:[{openings, attendanceTotal, attendanceAverage, team, season}], aggregateTotals}"

  # ─── mlb.reference (more) — single team, staff, affiliates, catalogues ──
  - name: mlb_team
    group: mlb.reference
    capabilities: [ref.teams]
    summary: "Single team detail by id — name, league/division, venue, colours, founding."
    base: default
    path: /teams/{teamId}
    auth: default
    params:
      - { name: teamId, in: path, type: integer, required: true, description: "Team id." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: hydrate, in: query, type: string, description: "Embed related objects (e.g. 'venue,league,division,social')." }
    response_hint: "{teams:[{id, name, abbreviation, league, division, venue, locationName, firstYearOfPlay}]}"

  - name: mlb_team_coaches
    group: mlb.reference
    capabilities: [ref.coaches]
    summary: "A team's coaching staff — manager, hitting/pitching/bench coaches, etc."
    base: default
    path: /teams/{teamId}/coaches
    auth: default
    params:
      - { name: teamId, in: path, type: integer, required: true, description: "Team id." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: date, in: query, type: string, description: "As-of date (YYYY-MM-DD)." }
    response_hint: "{roster:[{person, jobId, job, title}], teamId}"

  - name: mlb_team_personnel
    group: mlb.reference
    capabilities: [ref.coaches]
    summary: "A team's front-office / non-uniformed personnel."
    base: default
    path: /teams/{teamId}/personnel
    auth: default
    params:
      - { name: teamId, in: path, type: integer, required: true, description: "Team id." }
      - { name: date, in: query, type: string, description: "As-of date (YYYY-MM-DD)." }
    response_hint: "{roster:[{person, job, title}], teamId}"

  - name: mlb_team_alumni
    group: mlb.reference
    capabilities: [ref.players]
    summary: "Former players (alumni) for a team in a season + group (hitting/pitching/fielding)."
    base: default
    path: /teams/{teamId}/alumni
    auth: default
    params:
      - { name: teamId, in: path, type: integer, required: true, description: "Team id." }
      - { name: season, in: query, type: integer, required: true, description: "Season year." }
      - { name: group, in: query, type: string, default: hitting, description: "hitting | pitching | fielding." }
    response_hint: "{people:[{id, fullName, primaryPosition, mlbDebutDate}]}"

  - name: mlb_teams_history
    group: mlb.reference
    capabilities: [ref.teams]
    summary: "Franchise history (name/league/division changes over time) for one or more teams."
    base: default
    path: /teams/history
    auth: default
    params:
      - { name: teamIds, in: query, type: string_csv, required: true, description: "Team id(s)." }
      - { name: startSeason, in: query, type: integer, description: "First season." }
      - { name: endSeason, in: query, type: integer, description: "Last season." }
    response_hint: "{teams:[{id, name, season, league, division, locationName, active}]}"

  - name: mlb_teams_affiliates
    group: mlb.reference
    capabilities: [ref.teams]
    summary: "A club's affiliated teams across the minor-league levels."
    base: default
    path: /teams/affiliates
    auth: default
    params:
      - { name: teamIds, in: query, type: string_csv, required: true, description: "Parent team id(s)." }
      - { name: season, in: query, type: integer, description: "Season year." }
      - { name: hydrate, in: query, type: string, description: "Embed related objects." }
    response_hint: "{teams:[{id, name, sport, league, parentOrgId, parentOrgName}]}"

  - name: mlb_team_uniforms
    group: mlb.reference
    capabilities: [ref.teams]
    summary: "Uniform assets / descriptions for one or more teams."
    base: default
    path: /uniforms/team
    auth: default
    params:
      - { name: teamIds, in: query, type: string_csv, required: true, description: "Team id(s)." }
      - { name: season, in: query, type: integer, description: "Season year." }
    response_hint: "{uniforms:[{teamId, uniformAssets:[{uniformAssetText, uniformAssetType, ...}]}]}"

  - name: mlb_conferences
    group: mlb.reference
    capabilities: [sport.competitions_list]
    summary: "Conference catalogue (used by some leagues / amateur levels)."
    base: default
    path: /conferences
    auth: default
    params:
      - { name: conferenceId, in: query, type: integer, description: "Filter to one conference." }
      - { name: season, in: query, type: integer, description: "Season year." }
    response_hint: "{conferences:[{id, name, abbreviation, league, hasWildcard}]}"

  - name: mlb_people
    group: mlb.reference
    capabilities: [ref.players]
    summary: "Batch player profiles for a list of personIds (the multi-id form of mlb_player)."
    base: default
    path: /people
