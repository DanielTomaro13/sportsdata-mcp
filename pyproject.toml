[project]
name = "sportsdata-mcp"
version = "0.30.0"
description = "MCP server for sports-data APIs (bookmakers, league data, aggregators). Capability-tag system enables cross-provider composition."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Daniel Tomaro"}]
keywords = ["mcp", "model-context-protocol", "sports", "sports-data", "betting", "odds", "statistics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
# Upper bounds cap the supply-chain blast radius of a breaking/compromised MAJOR for this
# private app (no lockfile yet). Bounds sit above the currently-resolved versions.
dependencies = [
  "fastmcp>=0.4,<4",
  "httpx[http2]>=0.27,<1",
  "pydantic>=2.5,<3",
  "pyyaml>=6.0,<7",
  "click>=8.1,<9",
  # refresh-hashes prints persisted-query documents from bundle ASTs (Entain APQ).
  "graphql-core>=3.2,<4",
]

[project.optional-dependencies]
# Kalshi's optional authenticated tier (RSA request signing). Reads work without it.
kalshi-auth = [
  "cryptography>=42,<50",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  # Capped like the runtime deps: ruff is a CI GATE, and an uncapped linter turns
  # every upstream release that adds a rule into a red build on an untouched repo
  # (0.16 did exactly that — 32 findings across files nobody had edited). Raise the
  # cap deliberately, then fix the new findings in that same commit.
  "ruff>=0.4,<0.17",
  "cryptography>=42,<50",
  # PyYAML ships no inline types, so every `import yaml` was an untyped-import error and
  # the three config/spec loaders that use it went unchecked.
  "types-PyYAML>=6",
  "mypy>=1.11,<2",
]
# Standalone installer build (commerce Phase 3): PyInstaller bundle + the licence-gate
# crypto, so the downloadable build needs no Python and verifies entitlements offline.
build = [
  "pyinstaller>=6",
  "cryptography>=42,<50",
]

# Rendered as the sidebar links on the PyPI page. "Funding" gets PyPI's own
# heart icon and is the only donate surface a `pip install` user ever sees.
[project.urls]
Homepage = "https://github.com/DanielTomaro13/sportsdata-mcp"
Source = "https://github.com/DanielTomaro13/sportsdata-mcp"
Issues = "https://github.com/DanielTomaro13/sportsdata-mcp/issues"
Changelog = "https://github.com/DanielTomaro13/sportsdata-mcp/blob/main/CHANGELOG.md"
Funding = "https://ko-fi.com/danieltomaro"

[project.scripts]
sportsdata-mcp = "sportsdata_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sportsdata_mcp"]

# Specs live inside the package and MUST ship in the wheel — the server loads them
# via importlib.resources, never from a cwd-relative ./specs/.
[tool.hatch.build]
include = [
  "src/sportsdata_mcp/**/*.py",
  "src/sportsdata_mcp/specs/*.yaml",
  # Printed persisted-query documents (APQ self-heal sidecars, written by refresh-hashes).
  "src/sportsdata_mcp/specs/*.documents.json",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true     # heavy runtime deps are not all installed in the lint step
warn_unused_ignores = true        # an ignore naming the wrong error code silences nothing
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live: integration tests that hit real third-party endpoints",
  "contract: live response-contract tests (structure matches the docs); resilient to transient/blocked endpoints",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
