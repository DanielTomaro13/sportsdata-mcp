name: Release (installers)

# Tag-triggered standalone-installer release (commerce Phase 3). On `vX.Y.Z` it builds
# the PyInstaller onedir for BOTH macOS and Windows and attaches them to the GitHub
# release. macOS: wrapped as sportsdata-mcp.app and — WHEN the Apple signing secrets are
# present — codesigned + notarized + stapled into a DMG; otherwise an UNSIGNED .app zip.
# Windows: the onedir (sportsdata-mcp.exe + runtime) zipped, UNSIGNED for now (no
# Authenticode cert) so it shows a SmartScreen "more info → run anyway" prompt until a
# cert is added. The pipeline is exercisable today (workflow_dispatch). Direct download.
#
# Secrets to add when ready (Settings → Secrets → Actions):
#   APPLE_CERT_P12_BASE64   base64 of the exported "Developer ID Application" .p12
#   APPLE_CERT_PASSWORD     the .p12 export password
#   APPLE_SIGNING_IDENTITY  "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID + APPLE_APP_PASSWORD + APPLE_TEAM_ID   (or the APPLE_API_* trio)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual UNSIGNED test builds — validates the bundle

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install (editable + build extra)
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/bin/pip install -e ".[build]"

      - name: Build onedir bundle + .app
        run: |
          sh scripts/build-installer.sh
          sh scripts/make-macos-app.sh

      - name: Import signing certificate (when configured)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12_BASE64" ]; then
            echo "no APPLE_CERT_P12_BASE64 secret — this will be an UNSIGNED build"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign + notarize (when configured), else zip unsigned
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="$(.venv/bin/python -c 'import sportsdata_mcp; print(sportsdata_mcp.__version__)')"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            sh scripts/sign-and-notarize.sh
          else
            # No Developer ID: PyInstaller's per-binary ad-hoc signatures stand, but the
            # bundle can't be cleanly sealed (codesign rejects PyInstaller's .dist-info data
            # dirs under Contents/Frameworks), so a quarantined download reads as "damaged"
            # until notarized — the customer clears it once with
            #   xattr -dr com.apple.quarantine /Applications/sportsdata-mcp.app
            # Package with `ditto`, NOT `zip`: zip drops the framework symlinks and breaks
            # the nested signatures, which itself triggers "damaged".
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/sportsdata-mcp.app" "dist/sportsdata-mcp-$VERSION-macos-unsigned.zip"
            echo "built ditto-packaged dist/sportsdata-mcp-$VERSION-macos-unsigned.zip (ad-hoc nested sigs)"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sportsdata-mcp-macos
          path: |
            dist/*.dmg
            dist/*-unsigned.zip
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.dmg
            dist/*-unsigned.zip
          fail_on_unmatched_files: false

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install (editable + build extra)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -e ".[build]"

      - name: Build onedir bundle (UNSIGNED)
        shell: bash
        run: sh scripts/build-installer.sh

      - name: Package the onedir as a zip
        shell: bash
        run: |
          VERSION="$(.venv/Scripts/python.exe -c 'import sportsdata_mcp; print(sportsdata_mcp.__version__)')"
          # Zip the whole onedir folder → the customer gets sportsdata-mcp.exe + its runtime.
          # UNSIGNED (no Authenticode cert yet): Windows SmartScreen shows "Windows protected
          # your PC" → More info → Run anyway. The mirror of the macOS xattr step.
          powershell -Command "Compress-Archive -Path dist/sportsdata-mcp -DestinationPath dist/sportsdata-mcp-$VERSION-windows.zip -Force"
          echo "built dist/sportsdata-mcp-$VERSION-windows.zip (UNSIGNED)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sportsdata-mcp-windows
          path: dist/*-windows.zip
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*-windows.zip
          fail_on_unmatched_files: false
