# Nightly spec-contract drift check.
#
# `sportsdata-mcp doctor` probes one representative endpoint per provider group
# (reachability + auth + REST contract). Books change unofficial APIs without
# notice — this turns silent drift into a red run (GitHub emails the owner when
# a scheduled workflow fails) instead of a customer-visible breakage.
#
# Some AU books geo/bot-block cloud IPs, so those providers fail here even when
# they work from a residential machine. `.github/drift-known-blocked.txt` lists
# them; the job goes red only when a provider OUTSIDE that list fails — i.e. on
# NEW drift. Full unblocked coverage still happens on the operator's machine
# (`sportsdata-mcp doctor` locally / the agents ops plane).

name: drift
on:
  schedule:
    - cron: "0 18 * * *" # 04:00 AEST — quiet hours, before the AU sporting day
  workflow_dispatch: {}

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # re-probes now wait up to 60+180+300s before confirming
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Run doctor (all providers)
        id: doctor
        # No config file exists on a runner, so the group set MUST come from the env —
        # without it doctor probes nothing and exits 0 (a vacuous green caught on the
        # first calibration run). Doctor exits nonzero on any FAIL — including
        # known-blocked ones — so the real verdict is computed in the next step.
        env:
          SPORTSDATA_MCP_GROUPS: "*"
        run: |
          sportsdata-mcp doctor 2>&1 | tee doctor.log || true
      - name: Fail only on NEW drift (outside the known-blocked list)
        env:
          SPORTSDATA_MCP_GROUPS: "*"
        run: |
          # A failing provider = a "[provider/group]" header whose probe line said FAIL.
          verdict() {
            log="$1"
            # Empty probe set = misconfiguration, never success.
            if ! sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -q "^\["; then
              echo "::error::doctor probed nothing — group selection is broken"; exit 1
            fi
            sed 's/\x1b\[[0-9;]*m//g' "$log" | awk '
              /^\[/ { split($1, a, "[\\[/]"); prov = a[2] }
              /→ FAIL/ { print prov }
            ' | sort -u
          }

          # The same scan, keeping WHY each provider failed. The verdict only needs the
          # names, but the alert that lands in an inbox needs the reason: "drift
          # confirmed" reads as "our spec is wrong" when an HTTP 503 on the provider's
          # own front page means their site is simply down, and nothing here can fix it.
          # An alert that misnames the cause is how an alert stops being read.
          reasons() {
            sed 's/\x1b\[[0-9;]*m//g' "$1" | awk '
              /^\[/ { split($1, a, "[\\[/]"); prov = a[2] }
              /→ FAIL/ { sub(/^[^→]*→ */, ""); print prov "  " $0 }
            ' | sort -u
          }
          sort -u .github/drift-known-blocked.txt | grep -v "^#" | grep -v "^$" > known.txt || true
          verdict doctor.log > failed.txt
          comm -23 failed.txt known.txt > new-drift.txt
          echo "── failing providers:"; cat failed.txt || true
          echo "── known-blocked from CI:"; cat known.txt || true

          # Confirm before crying wolf. These are live third-party APIs: a single 403
          # or timeout is often transient (Pinnacle did exactly that on 2026-08-04,
          # green again next run). Re-probe ONLY the suspects and fail only if the
          # drift repeats — cheap, because this path runs solely when something failed,
          # and it keeps flaky upstreams out of drift-known-blocked.txt, which would
          # blind the check permanently.
          if [ -s new-drift.txt ]; then
            echo "── suspected new drift, re-probing to confirm:"; cat new-drift.txt

            # Re-probe SEVERAL times, with a widening gap, and confirm only what fails
            # EVERY time. A single re-probe 20s later lands inside the same edge-block
            # window as the first, so a brief Cloudflare block on a busy endpoint was
            # indistinguishable from real drift — which is what happened to Polymarket's
            # clob endpoint (2 failures in 10 nightly runs, green in between, alerting
            # both times). The suspect set only ever shrinks: a provider that recovers
            # on any attempt is transient by definition and drops out.
            for wait in 60 180 300; do
              [ -s new-drift.txt ] || break
              echo "   waiting ${wait}s before re-probe"
              sleep "$wait"
              # `provider.*` selects all of a provider's groups (engine-side since
              # v0.24.0). Before that it matched nothing and doctor exited 0 having
              # probed NOTHING, silently turning every real drift into a "transient"
              # pass — the guards here stay because that failure was invisible.
              retry_groups="$(paste -sd, - < new-drift.txt | sed 's/\([^,]*\)/\1.*/g')"
              echo "   re-probing groups: ${retry_groups:-<none>}"
              if [ -z "$retry_groups" ]; then
                echo "::error::could not resolve groups for the suspects — failing rather than assuming transient"
                exit 1
              fi
              SPORTSDATA_MCP_GROUPS="$retry_groups" sportsdata-mcp doctor 2>&1 | tee doctor-retry.log || true
              # Guard: the re-probe must actually have probed something, or "recovered"
              # is meaningless. verdict() already exits on an empty probe set.
              verdict doctor-retry.log > failed-retry.txt
              # Still-failing suspects carry forward; anything that answered is dropped.
              comm -12 new-drift.txt failed-retry.txt > still-failing.txt
              recovered="$(comm -23 new-drift.txt still-failing.txt)"
              # An `if`, not `[ -n ... ] && echo`. Under `bash -e` the && form is safe
              # only while something follows it — as the LAST command in the block it
              # exits 1 whenever nothing recovered, failing the step on the ordinary
              # path. That is a trap set for whoever edits this next, not a bug today.
              if [ -n "$recovered" ]; then
                echo "   recovered, dropping: $recovered"
              fi
              mv still-failing.txt new-drift.txt
            done

            if [ -s new-drift.txt ]; then
              echo "::error::NEW provider drift confirmed — failed the first probe and every re-probe:"
              # Name the reason, not just the provider. A 5xx is the provider's site
              # being down (nothing to fix here, it clears when they come back); a 403
              # or a bot challenge is a block; anything else is a genuine contract
              # change worth opening the spec for.
              reasons doctor-retry.log | grep -Ff new-drift.txt || cat new-drift.txt
              if reasons doctor-retry.log | grep -Ff new-drift.txt | grep -qE "HTTP 5[0-9][0-9]"; then
                echo "note: a 5xx is the PROVIDER'S SITE being unavailable, not spec drift."
                echo "      Nothing to change here — it clears when they are back up."
              fi
              exit 1
            fi
            echo "transient — recovered on re-probe, not real drift"
          fi
          echo "no new drift — all failures are the known cloud-IP blocks"
