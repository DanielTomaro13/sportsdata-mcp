# Weekly structure-drift check (§: agents depend on documented response shapes).
# Runs the live contract suite against the real upstreams: FAILs when an API we
# carry changes shape; SKIPs transient/geo-blocked feeds (AU bookmakers skip on
# GitHub runners — cover them locally with `pytest -m live`).
name: weekly-contracts
on:
  schedule:
    - cron: "0 19 * * 0"   # Mondays 05:00 AEST
  workflow_dispatch: {}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -m contract -q

  # Live tool probes. Drift XFAILs rather than failing the suite (so geo-blocked
  # feeds don't page anyone), which means a green run alone proves little — the
  # grep step below turns the one geo-independent drift signal (a persisted-query
  # hash the gateway no longer knows) into a hard failure. Endpoint drift on
  # AU-only bookmakers can't be seen from GitHub's runners; check the xfail lines
  # in this job's log, or run `pytest -m live -rxs` from an AU network.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -m live -q -rxs tests/integration | tee live-report.txt
      - name: Fail on persisted-query hash drift
        run: |
          if grep -Eq "PERSISTED_QUERY_NOT_FOUND|no longer registered|Recapture the hash" live-report.txt; then
            echo "::error::A GraphQL persisted-query hash has drifted — see documentation/Unibet.md (recapture) or run refresh-hashes."
            exit 1
          fi
