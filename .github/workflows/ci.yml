name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Lint specs
        run: sportsdata-mcp lint

      - name: Tests (offline only)
        # `live` tests hit real third-party endpoints and must never run in CI.
        run: pytest -m "not live"

  package:
    # Proves the wheel ships the packaged specs and the CLI loads them from the
    # installed package, not a cwd-relative ./specs/ (the uvx contract).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel into a clean venv and run from /tmp
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/sportsdata-mcp version
          /tmp/clean/bin/sportsdata-mcp list-groups
