name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      # Added once the tree was clean. It found two real latent crashes on the way —
      # a None hash subscripted in the refresh report, and a None hash subscripted
      # while RAISING the persisted-query error — so this is a gate worth having, not
      # a style preference.
      - name: Mypy
        run: mypy

      - name: Lint specs
        run: sportsdata-mcp lint

      - name: Tests (offline only)
        # The broad `live` integration suite hits real endpoints and stays out of CI.
        # The curated `contract` subset (also `live`-marked) runs in its own job below.
        run: pytest -m "not live"

  contract:
    # Live response-contract checks on every PR: verify each upstream API still
    # returns the shape we documented + coded. The test is resilient by design — it
    # SKIPS on transient/blocked/keyless endpoints (network errors, 5xx, 401/403/429,
    # geo-blocks, missing API keys, empty feeds) and only FAILS on a genuine shape
    # regression or a broken spec (wrong path/params → 4xx). Many bookmaker APIs
    # geo-block GitHub's runners and will simply skip here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Response contracts (live)
        env:
          # Optional: set this repo secret to also contract-check Data Golf
          # (it skips cleanly when the key is absent).
          DATAGOLF_KEY: ${{ secrets.DATAGOLF_KEY }}
        run: pytest -m contract -v

  package:
    # Proves the wheel ships the packaged specs and the CLI loads them from the
    # installed package, not a cwd-relative ./specs/ (the uvx contract).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Version lockstep
        # The `test` job asserts this too, but only after ~8 minutes of tests. A bump
        # that misses one of the four files is the likeliest way to redden main, so it
        # fails here in seconds instead (stdlib only — no install needed).
        run: python scripts/bump-version.py --check

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel into a clean venv and run from /tmp
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/sportsdata-mcp version
          /tmp/clean/bin/sportsdata-mcp list-groups
