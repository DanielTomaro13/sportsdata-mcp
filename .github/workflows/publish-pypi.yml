# Publish to PyPI on a GitHub release, via Trusted Publishing (OIDC — no tokens).
#
# One-time setup on PyPI (pypi.org → your account → Publishing): add a trusted
# publisher for project `sportsdata-mcp` with:
#   Owner: DanielTomaro13 · Repo: sportsdata-mcp · Workflow: publish-pypi.yml
#   Environment: pypi
# After that, cutting a GitHub release publishes the matching version. The wheel
# bundles the provider specs, so `pip install sportsdata-mcp` / `uvx sportsdata-mcp`
# serve the full catalogue out of the box (verified: 84 groups from a clean install).

name: publish-pypi
on:
  # Tag push is the reliable trigger: release.yml creates the GitHub Release with
  # the default GITHUB_TOKEN, and releases created that way do NOT fire
  # `release: published` for other workflows (Actions' anti-recursion rule), so
  # v0.20–v0.22 shipped installers but silently never reached PyPI. Tag push has
  # no such gate. (release/dispatch kept as belt-and-braces; PyPI ignores a
  # re-upload of an existing version.)
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for trusted publishing — the only credential needed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # Bumped from v1.12.4 after v0.24.1 failed with
        #   InvalidDistribution: '2.5' is not a valid metadata version
        # Nothing was wrong with the wheel: hatchling now emits Metadata-Version 2.5
        # and the twine inside the older action predates it. Build deps are not
        # pinned, so the runner picked up a newer hatchling and the stale validator
        # rejected a perfectly good artifact.
        with:
          # tag-push + release + dispatch can overlap for one version; a
          # re-upload of an already-published version is then a clean no-op
          skip-existing: true
