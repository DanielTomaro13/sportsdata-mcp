# Publish to PyPI on a GitHub release, via Trusted Publishing (OIDC — no tokens).
#
# One-time setup on PyPI (pypi.org → your account → Publishing): add a trusted
# publisher for project `sportsdata-mcp` with:
#   Owner: DanielTomaro13 · Repo: sportsdata-mcp · Workflow: publish-pypi.yml
#   Environment: pypi
# After that, cutting a GitHub release publishes the matching version. The wheel
# bundles the provider specs, so `pip install sportsdata-mcp` / `uvx sportsdata-mcp`
# serve the full catalogue out of the box (verified: 84 groups from a clean install).

name: publish-pypi
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for trusted publishing — the only credential needed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
